 if(hexDist(from.q,from.r,to.q,to.r)!==1)return "нужен соседний гекс";
 if(!armyMoveTileOpen(to))return "гекс занят другой фишкой, армией или угрозой";
 if(armyForeignZone(pi,to))return "без нападения нельзя входить в чужую зону";

// Цели для планирования ИИ: враждебные армии, отдельные Пионеры, угрозы,
// занятые разбойниками Посты и чужие сооружения.
function armyStrategicTargets(pi){
 const out=[];G.map.forEach(h=>{if(armyFieldTarget(pi,h)||pioneerFieldTarget(pi,h)||h.chip||h.lair||armyGarrisonTarget(pi,h))out.push(h);});return out;
}
function armyCanAttackFromPos(pi,pos,target){

 while(queue.length){
  const cur=queue.shift();
  if(cur.path.length&&targets.some(t=>armyCanAttackFromPos(pi,cur.h,t)))return cur.path;
  if(cur.path.length>=10)continue;
  nb(cur.h.q,cur.h.r).forEach(n=>{
   if(n!==start&&!armyMoveTileOpen(n))return;
   if(armyForeignZone(pi,n)||armyTerrainReason(n))return;
   const add=armyWaterEntryCost(cur.h,n,entry.army.members.length),wood=cur.wood+add;
   if(wood>(p.wood||0))return;
   const k=K(n.q,n.r),old=seen.get(k);
   if(old!==undefined&&old<=wood)return;
   seen.set(k,wood);queue.push({h:n,path:cur.path.concat(n),wood});
  });
 }

}
function armyAIPower(entry){

}
function garrisonAIPower(option){

  const W=WAR[f.name]||{s:1,S:2};return n+(W.s+W.S)/2;
 },0);

function aiFormArmy(pi){

 for(const anchor of armyFormationOptions(pi)){
  const slots=armyFormationPool(pi,anchor),idx=armyAutoDraft(slots),chosen=idx.map(i=>slots[i]).filter(Boolean),tokens=chosen.map(s=>s.tok);
  if(armyCompositionReason(tokens))continue;
  const dest=armyFormationHexes(anchor,pi,tokens.length).sort((a,b)=>(a.g==="water")-(b.g==="water"))[0];
  if(!dest)continue;
  const cost=dest.g==="water"?tokens.length:0;if(cost>(p.wood||0))continue;
  chosen.forEach(s=>{s.tok=null;});if(cost)spend(p,cost,0,0,0);
  const usedPioneer=tokens.some(wt=>wt&&wt.t==="Пионер"&&pioneerMoveFinished(wt));
  dest.army={id:nextArmyId(),o:pi,members:tokens,moved:usedPioneer?ARMY_SPEED:0,attacked:false};
  if(G.acts)G.acts.armyFormed=1;
  stat("armyForm");log(`${p.name} сформировал армию №${dest.army.id}: ${armySummary(dest.army)}.`);recalc(pi);return true;
 }
 return false;
}
function aiArmyPhase(pi,profile){

 if(!(G.acts&&G.acts.assault)){
  const margin=(profile&&profile.margin)||1.05;
  const sorties=garrisonThreatAttackOptions(pi).map(o=>{
   const my=garrisonAIPower(o),foe=armyAITargetPower(o.target,pi);
   return {...o,my,foe,value:12+my-foe*1.15};
  }).filter(o=>o.foe===0||o.my>=o.foe*margin*0.8).sort((a,b)=>b.value-a.value);
  if(sorties.length){
   const best=sorties[0],oldCur=G.cur;G.cur=pi;
   const ok=doGarrisonThreatAttack(best.anchor.q,best.anchor.r,best.target.q,best.target.r,pi);

 }

   const path=armyAIFindPath(e);if(!path.length)break;
   const oldCur=G.cur;G.cur=pi;const ok=moveArmyTo(e.army.id,path[0].q,path[0].r,true);G.cur=oldCur;
   if(!ok)break;e=armyById(pi,e.army.id);
  }
 });
 if(G.acts.assault)return false;
 const options=armyAttackOptions(pi).map(o=>{
  const my=armyAIPower(o.entry),foe=armyAITargetPower(o.target,pi),threat=!!(o.target.chip||o.target.lair);
  let value=(threat?8:14)+my-foe*1.15;

  if(o.target.post)value+=5;
  if(o.target.bld&&o.target.bld.k==="monument")value+=3+monumentStage(o.target)*3;
  return {...o,my,foe,value};
 }).filter(o=>o.foe===0||o.my>=o.foe*((profile&&profile.margin)||1.05)*0.8)
   .sort((a,b)=>b.value-a.value);
 const oldCur=G.cur;G.cur=pi;
 if(options.length){
  const best=options[0],ok=doArmyAttack(best.entry.army.id,best.target.q,best.target.r,pi);G.cur=oldCur;return ok;
 }

  if(pioneerFieldTarget(pi,o.target))value+=4;
  if(o.target.bld&&o.target.bld.k==="monument")value+=3+monumentStage(o.target)*3;
  return {...o,my,foe,value};
 }).filter(o=>o.foe===0||o.my>=o.foe*((profile&&profile.margin)||1.05))
   .sort((a,b)=>b.value-a.value);
 if(!pioneers.length){G.cur=oldCur;return false;}
 const best=pioneers[0],ok=doPioneerAttack(best.source.q,best.source.r,best.target.q,best.target.r,pi);G.cur=oldCur;return ok;
}

// Цепочка фишек: соседние фишки из ТОГО ЖЕ мешочка втягиваются в бой, и так далее.
function chipChain(h){
 // Мешок фишки: разбойники и пираты — чёрный, звери и скорпионы — зелёный.
 // Дикий зверь без логова тоже зелёный: он вышел из зелёного мешка.
 const bagOf=x=>{
  if(!x.chip)return null;
  if(x.chip.wild){if(x.chip.bag)return x.chip.bag;if(x.chip.n==="Краб"||x.chip.n==="Рак")return "crab";if(x.chip.n==="Скорпион")return "scorpion";return "green";}
  return (lairType((G.lairs.find(l=>K(l.q,l.r)===x.chip.lair)||{}).n||"")||{}).bag||x.chip.bag;
 };
 // ЧЁРНЫЕ И ЗЕЛЁНЫЕ НИКОГДА НЕ ВОЮЮТ ВМЕСТЕ — это всегда разные армии,
 // даже если стоят вплотную. Внутри своего мешка фишки сцепляются как обычно.
 const linked=(a,b)=>bagOf(a)===bagOf(b);
 const start=bagOf(h); const seen=new Set([K(h.q,h.r)]),out=[h],stack=[h];
 while(stack.length){
  const c=stack.pop();
  nb(c.q,c.r).forEach(n=>{
   const k=K(n.q,n.r);
   if(seen.has(k)||!n.chip)return;
   if(!linked(c,n))return;
   seen.add(k);out.push(n);stack.push(n);
  });
 }
 return out;
}

const RIDERS=["Всадник","Всадник на скорпионе","Всадник на медведе"];

function uNameOf(u){return !u?"":u.kind==="chip"?(u.h&&u.h.chip?u.h.chip.n:u.name):u.name;}
function isRiderUnit(u){return !!u&&u.kind==="war"&&RIDERS.includes(u.name);}
function isRangeShooter(u){return !!u&&RANGE_SHOOTERS.includes(uNameOf(u));}
function isSiegeShooter(u){return !!u&&u.kind==="war"&&SIEGE_SHOOTERS.includes(u.name);}
function isShooter(u){return isRangeShooter(u)||isSiegeShooter(u);}
function isRam(u){return !!u&&u.kind==="war"&&u.name==="Таран";}
function isCatapult(u){return !!u&&u.kind==="war"&&u.name==="Катапульта";}
function isInfantry(u){
 if(!u||u.kind==="res")return false;

}
function isSiegeUnit(u){return !!u&&u.kind==="war"&&isSiege(u.name);}
function landmarkGuardRule(u){
 if(!u||u.kind!=="chip"||!u.h||!u.h.chip||!u.h.chip.guard)return null;
 return LANDMARK_GUARD_RULES[u.name]||null;
}
function isLandmarkGuardUnit(u,name){return !!(landmarkGuardRule(u)&&(!name||u.name===name));}
function isWebUnit(u){return !!(u&&u.kind==="web"&&u.webProfile);}
function chipWeakStrength(u){
 if(isWebUnit(u))return Number(u.webProfile.weak)||1;
 const c=u&&u.h&&u.h.chip,rule=landmarkGuardRule(u);
 return Number(rule&&rule.weak||c&&c.s)||1;
}
function chipStrongStrength(u){
 if(isWebUnit(u))return Number(u.webProfile.strong)||chipWeakStrength(u)+1;
 const c=u&&u.h&&u.h.chip,rule=landmarkGuardRule(u);
 return Number(rule&&rule.strong||c&&c.S)||chipWeakStrength(u)+1;
}

// Возвращает {foes:[...], FO, anchor, wall} — защитники, владелец, его город, укрепление-цель.
function defendersOf(target,pi){
 const out={foes:[],FO:null,anchor:null,wall:null,LR:null};
 // Отдельный Пионер — самостоятельная полевая цель. Даже если он стоит на
 // гексе чужой зоны, гарнизон поселения автоматически к нему не присоединяется.
 if(target.tok&&target.tok.w&&target.tok.t==="Пионер"&&Number(target.tok.o)!==Number(pi)){
  out.FO=target.tok.o;out.foes.push({h:target,name:"Пионер",kind:"war"});return out;
 }
 // Полевая армия — самостоятельная соседняя цель. В бой вступает вся её
 // стопка, но ни один гарнизон зоны автоматически не присоединяется.
 if(target.army&&Number(target.army.o)!==Number(pi)){
  out.FO=target.army.o;
  armyBattleSlots(target).forEach(w=>{if(w.tok)out.foes.push({h:w,name:w.tok.t,kind:"war"});});
  return out;
 }
 if(target.lair||target.chip){
  if(target.lair)out.LR=G.lairs.find(l=>l.q===target.q&&l.r===target.r);
  const chips=target.chip?chipChain(target):lairChips(out.LR||{q:target.q,r:target.r});
  if(target.lair&&target.chip&&!chips.some(c=>c===target))chips.push(target);
  const fight=chips.slice();
  if(!out.LR&&target.chip&&target.chip.lair){
   out.LR=G.lairs.find(l=>K(l.q,l.r)===target.chip.lair)||null;
  }
  if(!out.LR){const lh=fight.find(c=>c.lair);if(lh)out.LR=G.lairs.find(l=>l.q===lh.q&&l.r===lh.r);}
  if(out.LR){
   const already=new Set(fight.filter(c=>c._lairRef===out.LR&&Number.isInteger(c._lairGarrisonIndex)).map(c=>c._lairGarrisonIndex));
   lairInternalChips(out.LR).forEach(c=>{if(!already.has(c._lairGarrisonIndex))fight.push(c);});
  }
  fight.sort((x,y)=>(x.chip.boss?1:0)-(y.chip.boss?1:0));
  fight.forEach(c=>out.foes.push({h:c,name:c.chip.n,kind:"chip",boss:!!c.chip.boss}));
  const city=residentSettlementAt(target.q,target.r),controller=city?settlementController(city):null;
  if(controller!==null&&controller!==pi){
   const g=zoneGarrison(controller,city);
   if(g.length){out.FO=controller;out.anchor=city;g.forEach(w=>out.foes.push({h:w,name:w.tok.t,kind:"war"}));}
  }
  if(!city){
   for(let fi=1;fi<=G.N;fi++){
    if(fi===pi||G.out[fi])continue;
    const a=coveringAnchor(fi,target.q,target.r);if(!a)continue;
    const g=zoneGarrison(fi,a);
    if(g.length){out.FO=fi;out.anchor=a;g.forEach(w=>out.foes.push({h:w,name:w.tok.t,kind:"war"}));}
    break;
   }
  }
  return out;
 }
 if(target.bld||target.camp!==undefined&&target.camp!==null||target.post){
  if(target.post&&postBanditOccupied(target)){
   out.anchor=target;out.wall={h:target,kind:"city"};out.postBandits=true;
   postBanditSlots(target).forEach(c=>{if(c.chip)out.foes.push({h:c,name:c.chip.n,kind:"chip"});});
   return out;
  }
  const trueSettlement=isSettlement(target);
  const zoneCity=trueSettlement?target:
    ((target.bld&&target.bld.k==="monument")?null:residentSettlementAt(target.q,target.r));
  const cityController=zoneCity?settlementController(zoneCity):null;
  out.FO=cityController!==null?cityController:
    (target.post?target.post.o:(target.camp!==undefined&&target.camp!==null?target.camp:(target.bld&&target.bld.o)));
  const kind=trueSettlement?"city":target.camp?"city":target.bld.k;
  const a=(kind==="city")?target:
    (kind==="monument"?target:(zoneCity||coveringAnchor(out.FO,target.q,target.r)));
  out.anchor=a||target;
  out.wall={h:target,kind};
  // Новое нападение направлено именно на гарнизон выбранной постройки:
  // соседние полевые фишки и другие гарнизоны зоны автоматически не вступают.
  const g=hexWarSlots(out.anchor,out.FO);
  g.sort((x,y)=>((isLeaderName(x.tok.t)?1:0)-(isLeaderName(y.tok.t)?1:0)));
  g.forEach(w=>out.foes.push({h:w,name:w.tok.t,kind:"war"}));
  return out;
 }
 // Цель могла освободиться между выбором ИИ и началом боя.
 if(!target.tok)return out;
 out.FO=target.tok.o;
 if(target.tok.w){
  const a=coveringAnchor(out.FO,target.q,target.r);
  out.anchor=a;
  let g=a?zoneGarrison(out.FO,a):[];
  if(!g.length)g=[target];
  g.sort((x,y)=>((isLeaderName(x.tok.t)?1:0)-(isLeaderName(y.tok.t)?1:0)));
  g.forEach(w=>out.foes.push({h:w,name:w.tok.t,kind:"war"}));
 }else{
  out.FO=residentEffectOwner(target);
  const a=residentAnchorFor(out.FO,target.q,target.r);
  if(a){
   out.anchor=a;
   const g=zoneGarrison(out.FO,a);
   if(g.length)g.forEach(w=>out.foes.push({h:w,name:w.tok.t,kind:"war"}));
   else out.foes.push({h:target,name:target.tok.t,kind:"res"});
  }else{
   const guard=nb(target.q,target.r).find(n=>n.tok&&n.tok.o===out.FO&&n.tok.w);
   if(guard)out.foes.push({h:guard,name:guard.tok.t,kind:"war",ward:target});
   else out.foes.push({h:target,name:target.tok.t,kind:"res"});
  }
 }
 return out;
}

// Командир — князь или вожак логова. Они прикрыты свитой:
// пока жив хоть один другой воин их стороны, до командира не добраться.
// Всадники (полководцы) всегда стоят в Авангарде — они атакуют и их можно атаковать.
function unitClass(u){
 if(!u)return 0;
 if(u.boss)return 3;
 if(u.kind==="war"){if(u.name==="Князь")return 3;if(u.name==="Рыцарь")return 1;const c=WCLASS[u.name];return c==="офиц"?1:c==="полк"?2:0;}
 if(u.kind==="chip"||isWebUnit(u)){const s=chipWeakStrength(u);return s<=3?0:s===4?1:2;}
 return 0;
}
// Быть недоступным (прикрытым свитой) могут только вожак логова и князь;
// всадники стоят в Авангарде, а стрелки и тыл защищаются линией Авангарда или Стенами.
function isShielded(u){
 if(!u)return false;
 if(u.boss)return true;
 if(u.kind==="war")return isLeaderName(u.name);
 return false;
}
function sideOf(B,u){return B.foes.indexOf(u)>=0?B.foes:B.mine;}
// Вожак/князь недоступен, пока в его армии жив кто-то МЛАДШЕ по классу.
function cmdProtected(B,u){
 if(!u||!u.alive)return false;
 if(!isShielded(u))return false;
 const side=sideOf(B,u),myC=unitClass(u);
 // Рыцаря и Князя нельзя бить, пока жив любой другой воин их стороны.
 if(u.kind==="war"&&isLeaderName(u.name))return side.some(x=>x.alive&&x!==u&&x.kind==="war"&&!isSiegeUnit(x));
 return side.some(x=>x.alive&&x!==u&&!isSiegeUnit(x)&&unitClass(x)<myC);
}
// удар: мой воин i бьёт врага j
// Выбрать жетон для применения в бою
function pickTokenInBattle(name){const B=G.battle;if(!B)return;B.sToken=name;drawBattle();}
// «Применить» — фиксируем жетон (сжигаем перед атакой)
function useTokenInBattle(wn){const B=G.battle;if(!B)return;
 if(B.sToken){
  const mw=B.mine[B.sel];
  const idx=B.foes.findIndex(f=>f.alive&&canTargetInBattle(B,mw,f,"me"));
  if(idx>=0)battleStrike(idx);
  return;
 }
 const p=G.players[B.attacker];
 const t=p.handRes.find(c=>isToken(c)&&tokenFits(c,wn));
 if(!t){hint(`У вас нет подходящего жетона для ${wn}.`);return;}
 B.sToken=t;drawBattle();
}
function battleStrike(j){
 const B=G.battle; if(!B||B.turn!=="me"||B.sel===null)return;
 const myWar=B.mine[B.sel];
 const foeUnit=B.foes[j];
 const why=targetReason(B,myWar,foeUnit,"me");
 if(why){
  blog(why);return;
 }
 // навешиваем токен усиления, если выбран подходящий (и это не удар с лестницей / стрельба по стене)
 const intactWall=!!(foeUnit.line==="wall"&&B.foeHasWalls&&!B.wallsBroken);
 const weakHit=intactWall&&(isInfantry(myWar)||isRangeShooter(myWar));
 if(!weakHit&&!mushroomDazeApplies(B,myWar,foeUnit)&&B.sToken&&myWar.alive&&tokenFits(B.sToken,myWar.name)){
  B.useToken=B.sToken;
 }
 duel(myWar,foeUnit);
 const burned=B.useToken;
 B.useToken=null;
 B.sToken=null;
 if(burned){
  const ix=G.players[B.attacker].handRes.indexOf(burned);
  if(ix>=0)G.players[B.attacker].handRes.splice(ix,1);
  blog(`<b>Жетон «${burned}» сгорел в бою —</b> воин ${myWar.name} ударил силой `+
   `${warPowWithToken(myWar.name,burned)}`+
   (tokenPlus(burned)?` (максимум ${WAR[myWar.name].S} и +${tokenPlus(burned)} от жетона)`:``)+`.`);
 }
 B.sel=null;
 if(battleOver())return;
 B.turn="foe";B.dsel=null;drawBattle();
 if(B.defHuman)return;                 // защитник — человек: он сам выберет ответный удар
 setTimeout(foeMove,650);
}
// одна схватка: обе стороны бросают монету
// МАСТЕРА: пока у игрока на поле стоит нужный мастер, его воины бьют сильной стороной без броска.
const SMITH={"Мечник":"Кузнец","Паладин":"Кузнец","Лучник":"Стрелозаготовщик","Арбалетчик":"Стрелозаготовщик","Всадник":"Коневод"};
function hasMaster(pi,name){
 const m=SMITH[name]; if(!m||pi===undefined||pi===null)return false;
 for(const h of G.map.values())if(h.tok&&h.tok.o===pi&&!h.tok.w&&h.tok.t===m)return true;
 return false;
}
function warRoll(u){
 const W=WAR[u.name]; if(!W)return 0;
 const o=u.h&&u.h.tok?u.h.tok.o:u.o;
 if(hasMaster(o,u.name))return W.S;
 return coin()===2?W.S:W.s;
}
function shooterMinDef(u){
 if(!u||isCatapult(u)||u.kind==="res")return 0;
 if(u.kind==="chip"||isWebUnit(u))return chipWeakStrength(u);
 return WAR[u.name]?WAR[u.name].s:1;
}
function duel(a,b){
 const B=G.battle;
 if(isSiegeUnit(a)&&siegeCrewValid(B,a))blog(`${a.crew.name} действует орудием «${a.name}» вместо личной атаки.`);
 const intactWall=!!(b.line==="wall"&&B.foeHasWalls&&!B.wallsBroken);
 const usedLadder=intactWall&&isInfantry(a);
 const wallShooter=intactWall&&isRangeShooter(a);
 const mine=B.mine.includes(a);
 const atkOwner=mine?B.attacker:B.FO;
 const wallShooterHasMaster=wallShooter&&hasMaster(atkOwner,a.name);
 const dazed=mushroomDazeApplies(B,a,b);
 if(usedLadder){
  const p=G.players[B.attacker];
  if(p){p.wood=clampRes((p.wood||0)-1);recalc(B.attacker);}
  B.useToken=null;B.sToken=null;
 }
 if(wallShooter||dazed){
  // «Дурман спор» не даёт сжечь жетон впустую: без профильного мастера
  // любой удар фиксируется на базовой слабой стороне.
  B.useToken=null;B.sToken=null;
 }
 // токен усиления: для атакующего воина-моего игрока B.useToken(NAME) принудительно выставляет S
 let forcedS=false;
 if(!usedLadder&&!wallShooter&&!dazed&&mine&&B.useToken&&tokenFits(B.useToken,a.name)){forcedS=true;}
 const W=WAR[a.name];
 const as=dazed?(W?W.s:1)
         :usedLadder?(W?W.s:1)
         :wallShooter?(wallShooterHasMaster?(W?(coin()===2?W.S:W.s):1):(W?W.s:1))
         :forcedS?warPowWithToken(a.name,B.useToken)
         :(a.kind==="chip"||isWebUnit(a))?chipRollInfo(a).value
         :warRoll(a);
 const meleeVsShooter=!isShooter(a)&&isShooter(b);
 let bs,bRoll=null;
 if(isCatapult(b))bs=0;
 else if(meleeVsShooter)bs=shooterMinDef(b);
 else if(b.kind==="chip"||isWebUnit(b)){bRoll=chipRollInfo(b);bs=bRoll.value;}
 else if(b.kind==="res")bs=0;
 else bs=warRoll(b);
 const tag=dazed?` («Дурман спор»: слабая сила${hasMaster(atkOwner,a.name)?"; мастер возвращает обычный бросок":""})`
          :usedLadder?" (с лестницей −1 дерево, меньшая сила, лестница сгорела)"
          :wallShooter?(wallShooterHasMaster?" (выстрел по стенам со Стрелозаготовщиком — дебафф стены снят)":" (выстрел по стенам — меньшая сила)")
          :"";
 const defTag=meleeVsShooter?" (стрелок защищается меньшей силой)":"";
 if(isSiegeUnit(b)){
  blog(`${a.name} не может повредить ${b.name}: осадные орудия не уничтожаются в бою.`);return;
 }
 if(isWebUnit(b)){

function chooseRevoltCasualty(id){

function setRevoltSurvivor(slot,keep){

 const assignments=revoltSurvivorAssignments(B);
 if(!assignments[slot])return;

function applyRevoltAftermath(B){
 const rev=B.revolt,city=hx(...rev.cityKey.split(",").map(Number));
 if(!city)return;
 const byId=new Map(rev.pool.map(r=>[r.id,r]));
 (rev.casualties||[]).forEach(id=>{const r=byId.get(id);if(r)returnTokToBag(r.t);});
 const assignments=revoltSurvivorAssignments(B),newPool=[];
 const survivors=B.mine.filter(u=>u.alive&&u.revoltTier&&u.h&&u.h.tok&&u.h.tok.w)
  .sort((a,b)=>a.revoltSlot-b.revoltSlot);

  const record=assignments[u.revoltSlot];if(!record)return;
  if(rev.won&&rev.keepChoices[u.revoltSlot]===true){
   delete u.h.tok.revolt;delete u.h.tok.revoltId;
  }else{
   const token={...record.token,o:rev.owner,w:0,revoltId:record.id};
   delete token.revolt;u.h.tok=token;
   if(!rev.won)newPool.push({id:record.id,t:record.t,tier:record.tier,q:u.h.q,r:u.h.r});

  if(survivors.some(u=>!Object.prototype.hasOwnProperty.call(B.revolt.keepChoices,u.revoltSlot))){renderRevoltAftermath(B);return;}

function autoRevoltAftermath(B){

 if(mine&&!foes)return G.players[B.attacker]?Number(B.attacker):null;

function captureStandaloneGarrison(spot,captor){

// После победы за сооружение гарнизон заполняется выжившими до обычной

// гексе; как и после обычных потерь, такая остаточная стопка может потребовать
// пополнения у своего гарнизона, прежде чем снова маршировать и нападать.
function stationVictoriousArmy(B,spot){
 if(!B||!spot||!isGarrisonPost(spot)||garrisonController(spot)!==B.attacker)return 0;
 if(B.armyAttack){
  const e=armyById(B.attacker,B.armyId);if(!e)return 0;
  const members=e.army.members.slice(),room=garRoom(spot);if(!members.length)return 0;
  // Квадратные орудия никогда не занимают гарнизонных мест. Сначала внутрь
  // входят только воины; если полевой армии больше нет, все её орудия уходят
  // в безразмерный резерв этого гарнизона.
  const moving=members.filter(w=>!isSiege(w.t)).slice(0,room),moveSet=new Set(moving);
  e.army.members=e.army.members.filter(w=>!moveSet.has(w));
  garList(spot).push(...moving);
  const fieldFighters=e.army.members.filter(w=>!isSiege(w.t));
  let parked=0;
  if(!fieldFighters.length){
   const guns=e.army.members.filter(w=>isSiege(w.t));parked=guns.length;
   siegeReserveList(spot).push(...guns);e.army.members=[];
  }
  if(!e.army.members.length)delete e.h.army;
  log(`<b>После победы ${moving.length} выживших вошли в гарнизон «${spot.n}»</b> (${garList(spot).length}/${garCap(spot)})`+
   `${parked?`; ${parked} оруд. помещено в резерв без занятия мест`:""}${e.army.members&&e.army.members.length?`; остальные ${e.army.members.length} сохранили армию рядом`:"; полевая армия распущена"}.`,isHuman(B.attacker));
  stat("armyGarrisonAfterVictory");return moving.length;
 }
 if(B.pioneerAttack&&garRoom(spot)>0){
  const from=B.pioneerHex?hx(...B.pioneerHex.split(",").map(Number)):null;
  const wt=from&&from.tok&&from.tok.t==="Пионер"&&Number(from.tok.o)===Number(B.attacker)?from.tok:null;
  if(!wt)return 0;
  from.tok=null;garList(spot).push(wt);
  log(`<b>Победивший Пионер вошёл в гарнизон «${spot.n}»</b> (${garList(spot).length}/${garCap(spot)}).`,isHuman(B.attacker));
  stat("pioneerGarrisonAfterVictory");return 1;
 }
 return 0;
}
function advanceVictoriousArmy(B){

 if(!intended||battleFighters(B.foes).length||!battleFighters(B.mine).length)return false;
 const to=B.target;
 if(to.army&&(to.army.members||[]).length)return false;
 if(to.tok&&to.tok.w&&Number(to.tok.o)!==Number(B.attacker))return false;

  const e=armyById(B.attacker,B.armyId);if(!e)return false;

  to.army.moved=ARMY_SPEED;to.army.attacked=true;markArmyPioneersMoved(to.army);

// ===== конец боя: подводим итоги, предлагаем штурм =====
function endBattle(){

 if(B.invasionBattle){finishInvasionBattle(B);return;}
 if(B.revolt&&!B.revolt.afterDone){
  prepareRevoltAftermath(B);
  if(isHuman(B.attacker)){renderRevoltAftermath(B);return;}
  autoRevoltAftermath(B);
 }
 // До захвата сооружений и перемещения армий победитель решает судьбу каждого
 // целого, но брошенного орудия проигравшей/отступившей стороны.
 if(handleSiegeAftermath(B))return;
 const me=G.players[B.attacker];
 const survivors=B.mine.filter(m=>m.alive&&m.h.tok&&!isSiegeUnit(m));
 const foeLeft=battleFighters(B.foes).length;
 if(B.kills||B.losses){
  const kv=B.killVP||0, lv=B.lossVP||0;
  if(kv)changeVP(B.attacker,kv,"battle_victory");
  if(lv)changeVP(B.attacker,-lv,"battle_losses");
  blog(`Счёт боя: убито ${B.kills} (+${kv} ПО), потеряно ${B.losses} (−${lv} ПО).`);
 }
 const armyVictory=!B.retreat&&!B.expl&&battleFighters(B.mine).length>0&&battleFighters(B.foes).length===0;
 if(B.wall&&armyVictory){
  const sp=B.wall.h;
  if(B.wall.kind==="city"&&isSettlement(sp)&&settlementController(sp)!==B.attacker){
   if(sp.post)capturePost(sp,B.attacker);   // Пост присваивается, а не оккупируется
   else occupySettlement(sp,B.attacker);
  }else if(B.wall.kind==="monument"){
   captureStandaloneGarrison(sp,B.attacker);
  }
  // Сначала меняется контроль, затем выжившие занимают свободные места гарнизона.
  stationVictoriousArmy(B,sp);
 }
 if(armyVictory&&B.fieldAdvance)advanceVictoriousArmy(B);
 if(!B.expl&&battleFighters(B.mine).length&&battleFighters(B.foes).length===0&&B.target&&!isSettlement(B.target)&&B.target.tok&&!B.target.tok.w&&B.target.tok.o===B.FO){
  const rt=B.target.tok.t;
  returnTokToBag(rt);B.target.tok=null;
  blog(`Защитники пали — <b>${rt}</b> потерян.`);
 }
 if(B.vpCity){changeVP(B.attacker,B.vpCity,"prince_defeated");blog(`За убийство князя: +${B.vpCity} ПО.`);}
 if(B.gold)spend(me,0,0,0,-B.gold);
 // логово: если гарнизон выбит, можно бить саму угрозу
 // Обычное поселение оккупируется после штурма; Пост полностью переходит победителю.
 // Монумент является самостоятельной целью, основанной Пионером напрямую.
 // Остаётся только добивание самой угрозы логова.
 const offer=null;   // отдельного добивания нет: логово держится вожаком
 if(B.bossDown){
  const L=B.bossDown;
  if(B.expl){
   // Вожак убит разведчиком при открытии: +4 ПО, и логово падает сразу —
   // гарнизон разбегается, гекс становится обычным, разведчик занимает его (ред. 28).
   // Логово НЕ расширяется: тело B.lairExpand сработает только для живого логова.
   changeVP(B.attacker,4,"lair_boss");
   blog(`Вожак «${L.n}» убит при открытии: <b>+4 ПО</b>.`);
   const lh2=hx(L.q,L.r)||{q:L.q,r:L.r,n:L.n};
   finishLair(lh2,0,{pi:B.attacker,noVP:true});   // +4 уже начислены выше
  }else{
   const h=hx(L.q,L.r)||{q:L.q,r:L.r,n:L.n};
   finishLair(h,0);                       // вожак мёртв — логово пало
  }
 }else if(B.LR){
  B.LR.chips=lairChips(B.LR).length;
 }
 stat("attack");
 // Любое объявленное нападение армии, отдельного Пионера или гарнизона
 // расходует одно военное действие, даже если угроза находится в своей зоне.

function bestPowWithHand(pi,name){

  if(isToken(x)&&tokenFits(x,name))m=Math.max(m,warPowWithToken(name,x));
 });

}
// ИИ навешивает жетон усиления, но только когда тот реально меняет исход удара:

function aiPickToken(B,a,t){
 B.useToken=null;
 const P=G.players[B.attacker];
 if(mushroomDazeApplies(B,a,t))return;
 if(!P||!P.handRes||!P.handRes.length||!WAR[a.name])return;
 const cands=P.handRes.filter(x=>isToken(x)&&tokenFits(x,a.name));
 if(!cands.length)return;
 let best=null,bp=-1;
 cands.forEach(x=>{const pw=warPowWithToken(a.name,x);if(pw>bp){bp=pw;best=x;}});
 // Бой — бросок: враг покажет слабую или сильную сторону. Жетон стоит жечь, если
 // он даёт шанс там, где своей силы не хватало. Вожак логова имеет профиль 5/6;
 // усиление может превратить рискованный удар в надёжный.
 const lo=foeMinStr(t), hi=foeMaxStr(t);
 const plain=WAR[a.name].S;
 if(!best)return;
 if(plain>=hi)return;          // и без жетона побеждаем при любом броске — бережём
 if(bp<lo)return;              // даже с жетоном не достаём — не тратим впустую
 if(bp<=plain)return;          // жетон ничего не добавляет этому воину
 B.useToken=best;
}

function effMinStr(pi,u){

function unitBattleVal(u){

 if(u.boss||u.name==="Князь")return 22;
 if(u.kind==="res")return 5;
 if(u.kind==="chip"||isWebUnit(u)){

// ИИ-перестроение пехоты между Авангардом и Тылом/Стенами
function aiAdjustLines(B,side){
 if(!B)return;
 if(side==="me"){
  // Нападающий держит пехоту в Авангарде, чтобы она прикрывала стрелков и могла атаковать
  B.mine.forEach(m=>{
   if(m.alive&&canToggleLine(B,m,"me"))m.line="van";
  });
 }else{
  // Защитник: если стены целы — пехота держит оборону на стенах,
  // но если у защитника на стенах нет стрелков, а нападающий расстреливает стены дальнобойными орудиями/стрелками
  // или у нападающего открыт Тыл с катапультой/стрелком — сильнейший пехотинец делает вылазку в Авангард!
  if(B.foeHasWalls&&!B.wallsBroken){
   const hasDefShooter=B.foes.some(f=>f.alive&&isShooter(f));
   const hasDefVan=B.foes.some(f=>f.alive&&f.line==="van");
   const atkShooters=B.mine.filter(m=>m.alive&&isShooter(m));
   const atkVan=B.mine.filter(m=>m.alive&&m.line==="van");
   if(!hasDefShooter&&!hasDefVan&&(atkShooters.length>0||atkVan.length===0)){
    const inf=B.foes.filter(f=>f.alive&&canToggleLine(B,f,"foe"));
    if(inf.length){
     inf.sort((a,b)=>(WAR[b.name]?WAR[b.name].S:0)-(WAR[a.name]?WAR[a.name].S:0));
     inf[0].line="van";
    }
   }
  }else{
   // Стены пробиты или бой в поле: вся пехота (кроме Князя/Вожака) выходит в Авангард прикрывать стрелков и контратаковать
   B.foes.forEach(f=>{
    if(f.alive&&canToggleLine(B,f,"foe"))f.line="van";
   });
  }
 }
}
function aiShouldRetreat(B){

  const worm=att.find(a=>isLandmarkGuardUnit(a,"Кровавый червь"));

   const targets=me.filter(t=>canTargetInBattle(B,worm,t,"foe"))
    .sort((a,b)=>(str(a)-str(b))||((WAR[a.name]?WAR[a.name].S:0)-(WAR[b.name]?WAR[b.name].S:0))||(unitBattleVal(a)-unitBattleVal(b)));
   if(targets.length)return {a:worm,t:targets[0],sc:1000};

    const tMax=isCatapult(t)?0:meleeVsShooter?shooterMinDef(t):effMaxStr(B.attacker,t,false);
    const tVal=unitBattleVal(t); // орудия отфильтрованы targetReason: бить можно только их расчёт

     for(const rt of [tMin,tMax]){
      if(ra>=rt)killCnt++;
      if(!noCounter&&ra<=rt)dieCnt++;
     }
    }
    const pKill=killCnt/4, pDie=dieCnt/4;
    let sc=pKill*tVal*12 - pDie*aCost*9;
    if(pKill===0){

    }else{
     if(isShooter(a))sc+=65 + pKill*20;

     else if(isShooter(t))sc+=20 + pKill*10 - aMax*0.5;

function aiBattleLoop(){

  if(!me.length||!foe.length)break;
  if(idle>2)break;                      // патовая ситуация: никто не может ударить
  if(B.turn==="me"){
   assignDefaultSiegeCrews(B,"me");
   aiAdjustLines(B,"me");
   if(aiShouldRetreat(B)){

   }

     idle=0;B.turn="foe";continue;

   }

    doCatapultBreakWalls(B,pick.a);
   }else{
    const {a,t}=pick;
    aiPickToken(B,a,t);                    // жетон усиления, если без него удар не проходит
    duel(a,t);
    aiBurnToken(B,a);
   }
   aiHeal(B);                             // знахарь поднимает павшего, если есть заряд
   B.turn="foe";
  }else{
   assignDefaultSiegeCrews(B,"foe");
   if(aiShouldDefRepair(B)&&doDefenderRepair(B)){
    idle=0;
    B.turn="me";
    continue;
   }
   aiAdjustLines(B,"foe");
   const att=foeAttackers(B);
   if(!att.length){idle++;B.turn="me";continue;}   // защитники на стенах держат оборону
   const pick=aiBestStrike(B,"foe");
   if(!pick){idle++;B.turn="me";continue;}
   idle=0;
   duelFoe(pick.a,pick.t);
   aiHeal(B);                             // и после ответного удара тоже

   if(t.def)return;

   if(t.w){eat=-WAR[t.t].food;
    // разведчик — двигатель всей партии: жертвуем им в самую последнюю очередь
    val=t.t==="Пионер"?80:10;}
   else{const R=RES[t.t]||{d:{}};const d=R.d||{};
    eat=-(d.food||0);
    // кормильцев не трогаем совсем; добытчик дерева/камня/золота дороже дармоеда
    val=(d.food||0)>0?100:(1+(Math.max(0,d.wood||0)+Math.max(0,d.stone||0)
        +Math.max(0,d.steel||0)+Math.max(0,d.gold||0))*20);}
   if(eat<=0)return;                  // не трогаем тех, кто кормит
   if(val<wv){wv=val;worst=h;}
  };
  G.map.forEach(h=>{
   checkSlot(h);
   (h.gar||[]).forEach(wt=>{if(wt&&wt.o===AI)checkSlot(garSlot(h,wt));});
  });
  if(!worst)break;
  log(`${p.name} изгнал ${worst.tok.t}, спасаясь от голода.`);exilePenalty(AI,worst.tok.t);
  returnTok(worst.tok);
  worst.tok=null;useSpecialAction("exile");recalc(AI);
 }
 // Последняя проверка после боёв и возможного изгнания: обязательный воин
 // переводится именно во внутренний гарнизон каждого удерживаемого поселения.
 aiSecureOccupations(AI);
 endTurn();
}

// ============ ПАНОРАМИРОВАНИЕ / ЗУМ / ВКЛАДКИ =============
let userVB=null;      // если игрок сам двигал карту — не автоцентрируем
function getVB(){return (SVG.getAttribute("viewBox")||"0 0 100 100").split(" ").map(Number);}
function setVB(v){SVG.setAttribute("viewBox",v.join(" "));userVB=v.slice();}
function zoomBy(f,cx,cy){
 const vb=getVB();
 const px=cx===undefined?vb[0]+vb[2]/2:cx, py=cy===undefined?vb[1]+vb[3]/2:cy;
 const nw=Math.max(60,Math.min(6000,vb[2]*f)), nh=nw*vb[3]/vb[2];
 setVB([px-(px-vb[0])*(nw/vb[2]), py-(py-vb[1])*(nh/vb[3]), nw, nh]);
}
function fitBoard(){userVB=null;draw();}
function tab(id,btn){
 btn=btn||document.querySelector("#tabs button");if(!btn)return;
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.remove("on"));
 btn.classList.add("on");
 ["t1","t2","t3"].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.toggle("on",x===id);});
 invalidateBoardLayout();      // вкладка меняет размеры области карты
 draw();
}
function svgPt(clientX,clientY){
 const r=SVG.getBoundingClientRect(),vb=getVB();
 return [vb[0]+(clientX-r.left)/r.width*vb[2], vb[1]+(clientY-r.top)/r.height*vb[3]];
}
// --- мышь ---
let drag=null;
SVG.addEventListener("mousedown",e=>{drag={x:e.clientX,y:e.clientY,moved:0};SVG.classList.add("drag");});
addEventListener("mouseup",()=>{drag=null;SVG.classList.remove("drag");});
addEventListener("mousemove",e=>{
 if(!drag)return;
 const vb=getVB(),k=vb[2]/SVG.clientWidth;
 vb[0]-=(e.clientX-drag.x)*k; vb[1]-=(e.clientY-drag.y)*k;
 setVB(vb); drag.x=e.clientX; drag.y=e.clientY;
});
SVG.addEventListener("wheel",e=>{
 e.preventDefault();
 const [px,py]=svgPt(e.clientX,e.clientY);
 zoomBy(e.deltaY>0?1.12:0.89,px,py);
},{passive:false});
// --- тач: 1 палец = панорама, 2 пальца = щипковый зум ---
let touch=null;
function dist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.hypot(dx,dy);}
function mid(t){return [(t[0].clientX+t[1].clientX)/2,(t[0].clientY+t[1].clientY)/2];}
SVG.addEventListener("touchstart",e=>{
 const t=e.touches;
 if(t.length===1){touch={mode:1,x:t[0].clientX,y:t[0].clientY,moved:0};}
 else if(t.length===2){
  const [mx,my]=mid(t);
  touch={mode:2,d:dist(t),c:svgPt(mx,my),moved:9};
 }
},{passive:true});
SVG.addEventListener("touchmove",e=>{
 if(!touch)return;
 const t=e.touches;
 if(touch.mode===1&&t.length===1){
  e.preventDefault();
  const vb=getVB(),r=SVG.getBoundingClientRect(),k=vb[2]/r.width;
  const dx=t[0].clientX-touch.x, dy=t[0].clientY-touch.y;
  touch.moved+=Math.abs(dx)+Math.abs(dy);
  vb[0]-=dx*k; vb[1]-=dy*k; setVB(vb);
  touch.x=t[0].clientX; touch.y=t[0].clientY;
 }else if(touch.mode===2&&t.length===2){
  e.preventDefault();
  const nd=dist(t);
  if(touch.d>0){
   const [mx,my]=mid(t), [px,py]=svgPt(mx,my);
   zoomBy(touch.d/nd,px,py);
  }
  touch.d=nd;
 }
},{passive:false});
SVG.addEventListener("touchend",e=>{
 if(e.touches.length===0)touch=null;
 else if(e.touches.length===1)touch={mode:1,x:e.touches[0].clientX,y:e.touches[0].clientY,moved:9};
},{passive:true});

// ============ СТАРТОВЫЙ ЭКРАН =============
const SETUP={n:2,kind:{1:"human",2:"ai",3:"ai",4:"ai"},lvl:{1:2,2:2,3:2,4:2},
 names:{1:"",2:"",3:"",4:""},eventMode:"random",events:[]};
const CNAMES={1:"Синий",2:"Красный",3:"Зелёный",4:"Фиолетовый"};
function drawSetup(){
 document.getElementById("cnt").innerHTML=[2,3,4].map(n=>
   `<button class="${SETUP.n===n?'on':''}" onclick="setCount(${n})">${n}</button>`).join("");
 let h="";
 for(let i=1;i<=SETUP.n;i++){
  h+=`<div class="prow">`+
     `<span class="dot" style="background:${PC[i]}"></span>`+
     `<input class="nminp" maxlength="14" placeholder="${CNAMES[i]}" value="${(SETUP.names[i]||"").replace(/"/g,"&quot;")}" `+
       `oninput="setName(${i},this.value)" aria-label="Имя игрока ${i}">`+
     `<span class="tg">`+
       `<button class="${SETUP.kind[i]==='human'?'on':''}" onclick="setKind(${i},'human')">Человек</button>`+
       `<button class="${SETUP.kind[i]==='ai'?'on':''}" onclick="setKind(${i},'ai')">ИИ</button>`+
     `</span>`+
     (SETUP.kind[i]==='ai'
       ? `<span class="tg" style="margin-left:6px">`+
         [1,2,3].map(v=>`<button class="${SETUP.lvl[i]===v?'on':''}" onclick="setLvlSetup(${i},${v})">${LVLNAME[v]}</button>`).join("")+
         `</span>` : ``)+
     `</div>`;
 }
 document.getElementById("plist").innerHTML=h;
 const et=document.getElementById("eventtitle");if(et)et.textContent=`Гексы событий (нужно ${eventHexLimit(SETUP.n)} для ${SETUP.n} игроков)`;
 const em=document.getElementById("eventmode");
 if(em)em.innerHTML=
   `<button class="${SETUP.eventMode==='random'?'on':''}" onclick="setEventMode('random')">Случайно</button>`+
   `<button class="${SETUP.eventMode==='choice'?'on':''}" onclick="setEventMode('choice')">Выбрать вручную</button>`;
 const ep=document.getElementById("eventpick");
 if(ep)ep.innerHTML=SETUP.eventMode==='choice'
   ? `<p class="sub">Выбрано ${SETUP.events.length}/${eventHexLimit(SETUP.n)}. Нажмите нужное число разных гексов:</p><div class="row cnt">`+
     EVENT_HEX_NAMES.map(n=>`<button class="${SETUP.events.includes(n)?'on':''}" onclick="toggleEventHex('${n.replace(/'/g,"\'")}')">${n}</button>`).join("")+`</div>`
   : `<p class="sub">Будут случайно выбраны гексы событий: ${eventHexLimit(SETUP.n)} из десяти; они замешаются в активную колоду.</p>`;
 const start=document.getElementById("startbtn");
 if(start)start.disabled=SETUP.eventMode==='choice'&&SETUP.events.length!==eventHexLimit(SETUP.n);
}
function setName(i,v){SETUP.names[i]=v;}
function setCount(n){SETUP.n=n;SETUP.events=SETUP.events.slice(0,eventHexLimit(n));drawSetup();}
function setLvlSetup(i,v){SETUP.lvl[i]=v;drawSetup();}
function setKind(i,k){SETUP.kind[i]=k;drawSetup();}
function setEventMode(mode){SETUP.eventMode=mode;drawSetup();}
function toggleEventHex(name){
 const i=SETUP.events.indexOf(name);
 if(i>=0)SETUP.events.splice(i,1);
 else if(SETUP.events.length<eventHexLimit(SETUP.n))SETUP.events.push(name);
 drawSetup();
}
function makeRoundOrder(firstSeat){
 const order=[];
 for(let step=0;step<G.N;step++){
  const pi=((firstSeat-1+step)%G.N)+1;
  if(!G.out[pi])order.push(pi);
 }
 return order;
}
function startRegularPlay(){
 G.startFill=null;G.sel=null;highlight=[];G.started=true;
 G.firstPlayer=1;G.roundOrder=makeRoundOrder(G.firstPlayer);G.roundPos=0;
 G.cur=G.roundOrder[0]||1;
 for(let i=1;i<=G.N;i++)recalc(i);
 log(`<b>Начальная расстановка завершена.</b> В первом круге первым ходит ${G.players[G.cur].name}.`,1);
 draw();ui();
 if(isHuman(G.cur)&&G.humans>1)askPass(G.cur);
 else startTurn(G.cur);
}
function startInitialFill(){
 G.started=false;G.startFill={order:Array.from({length:G.N},(_,i)=>i+1),pos:0,placed:0,needed:0,tile:null,phase:"tiles"};
 log(`<b>Начальная расстановка — этап 1/2.</b> Вокруг своей деревни каждый игрок довыкладывает ровно четыре гекса: два «Плодородных поля», одну «Воду» и один «Лес» — в любом порядке. Вода, выложенная сейчас, чистая. Только после завершения всех зон игроки размещают Пионеров.`,1);
 startInitialFillPlayer();
}
function initialCampSlots(pi){
 let camp=null;
 G.map.forEach(h=>{if(!camp&&h.bld&&h.bld.k==="city"&&h.bld.o===pi)camp=h;});
 if(!camp)return [];
 return nbk(camp.q,camp.r).filter(([q,r])=>!hx(q,r));
}
function initialTileSlots(pi,card){
 if(!card||!isBaseHex(card))return [];
 return initialCampSlots(pi).filter(([q,r])=>biomeFits(card,q,r));
}
// Стартовый набор вокруг деревни закреплён правилом: два «Плодородных поля»,
// одна «Вода» и один «Лес». Порядок выкладки свободный, поэтому человек сам
// выбирает, какой из оставшихся гексов поставить следующим.
const INITIAL_FILL_TILES=Object.freeze(["Плодородное поле","Плодородное поле","Вода","Лес"]);
function initialFillQueue(){
 const sf=G.startFill;
 if(!sf)return [];
 if(!Array.isArray(sf.queue))sf.queue=INITIAL_FILL_TILES.slice();
 return sf.queue;
}
function initialFillPeek(name){
 const t=TERR.find(x=>x[1]===name);
 return t?{g:t[0],n:name}:null;
}
function initialFillTake(name){
 const deck=G.deck||[];
 const i=deck.findIndex(c=>c&&c.n===name);
 if(i>=0)return deck.splice(i,1)[0];
 return initialFillPeek(name);
}
function startInitialFillPlayer(){
 const sf=G.startFill;if(!sf)return;
 if(sf.phase==="pioneers"){startInitialPioneerPlayer();return;}
 if(sf.pos>=sf.order.length){beginInitialPioneerPhase();return;}
 const pi=sf.order[sf.pos];
 G.cur=pi;sf.placed=0;sf.tile=null;G.sel=null;highlight=[];
 sf.queue=INITIAL_FILL_TILES.slice();
 sf.needed=sf.queue.length;
 const freeSlots=initialCampSlots(pi).length;
 if(freeSlots<sf.needed)log(`Внимание: вокруг стартовой деревни игрока ${G.players[pi].name} найдено ${freeSlots} пустых мест вместо четырёх.`,1);
 if(isHuman(pi)){
  hint(`Этап 1/2: вокруг деревни нужно выложить два «Плодородных поля», одну «Воду» и один «Лес» в любом порядке.`);ui();
  if(G.humans>1)askPass(pi);else drawInitialStartHex();
 }else{
  hint(`ИИ ${G.players[pi].name} достраивает всю стартовую зону.`);ui();
  setTimeout(autoFillInitialStartHexes,250);
 }
}
function drawInitialStartHex(){
 const sf=G.startFill;if(!sf||sf.phase!=="tiles")return;
 const pi=sf.order[sf.pos];G.cur=pi;
 const queue=initialFillQueue();
 if(!queue.length||sf.placed>=sf.needed){finishInitialFillPlayer();return;}
 if(!isHuman(pi)){autoFillInitialStartHexes();return;}
 const counts={};
 queue.forEach(n=>{counts[n]=(counts[n]||0)+1;});
 const opts=Object.keys(counts).map(n=>{
  const card=initialFillPeek(n),fit=card?initialTileSlots(pi,card).length:0;
  return `<div class="opt">`+
   `<button ${fit?'':'disabled'} onclick="pickInitialStartHex('${n}')"><b>${n}${counts[n]>1?` ×${counts[n]}`:""}</b></button>`+
   (n==="Вода"?`<span style="color:#e0bd75">Вода при старте чистая — жетон угрозы не ставится.</span>`:`<span style="color:#e0bd75">Свободных мест у деревни: ${fit}</span>`)+
   (fit?``:`<div class="why">Нет подходящего пустого места у деревни.</div>`)+`</div>`;
 }).join("");
 openPick(`Стартовая зона: гекс ${sf.placed+1} из ${sf.needed} — какой гекс выкладываем?`,opts,"drawInitialStartHex()");
}
function pickInitialStartHex(name){
 closePick();
 const sf=G.startFill;if(!sf||sf.phase!=="tiles")return;
 const pi=sf.order[sf.pos];
 const card=initialFillPeek(name);
 const slots=card?initialTileSlots(pi,card):[];
 if(!slots.length){hint(`Для гекса «${name}» вокруг деревни нет подходящего пустого места.`);ui();drawInitialStartHex();return;}
 sf.tile=card;G.sel={type:"startfill"};highlight=slots;
 hint(`Этап 1/2 — гекс ${sf.placed+1}/${sf.needed}: «${name}». `+
  (name==="Вода"?"Вода при старте чистая — жетон угрозы не ставится. ":"")+
  `Выберите подсвеченное пустое место у деревни.`);
 ui();
}
function commitInitialStartHex(pi,q,r,card){
 if(!card)return false;
 const ok=initialTileSlots(pi,card).some(([a,b])=>a===q&&b===r);
 if(!ok)return false;
 const real=initialFillTake(card.n)||card;   // гекс физически уходит из колоды
 const h={q,r,...real};G.map.set(K(q,r),h);
 const queue=initialFillQueue(),qi=queue.indexOf(card.n);
 if(qi>=0)queue.splice(qi,1);
 // Начальная вода чистая: при раскладке деревни жетон угрозы не ставится.
 log(`${G.players[pi].name} достроил стартовый участок гексом «${card.n}».`,isHuman(pi));
 return true;
}
function placeInitialStartHex(q,r){
 const sf=G.startFill;if(!sf||sf.phase!=="tiles"||!sf.tile)return;
 const pi=sf.order[sf.pos],card=sf.tile;
 if(!commitInitialStartHex(pi,q,r,card)){hint("Этот гекс нельзя поставить сюда по правилам стыковки.");return;}
 sf.placed++;sf.tile=null;G.sel=null;highlight=[];
 if(sf.placed>=sf.needed)finishInitialFillPlayer();else drawInitialStartHex();
}
function autoFillInitialStartHexes(){
 const sf=G.startFill;if(!sf||sf.phase!=="tiles")return;
 const pi=sf.order[sf.pos];
 while(initialFillQueue().length){
  // Порядок для ИИ тоже свободный: берём любой оставшийся гекс, которому есть
  // куда лечь по правилам стыковки.
  let chosen=null;
  for(const name of initialFillQueue()){
   const card=initialFillPeek(name);
   const slots=card?initialTileSlots(pi,card):[];
   if(!slots.length)continue;
   const slot=rnd(slots);
   if(slot&&commitInitialStartHex(pi,slot[0],slot[1],card)){chosen=name;break;}
  }
  if(!chosen){
   log(`Игроку ${G.players[pi].name} не удалось выложить оставшиеся стартовые гексы: ${initialFillQueue().join(", ")}.`,1);
   break;
  }
  sf.placed++;
 }
 finishInitialFillPlayer();
}
function finishInitialFillPlayer(){
 const sf=G.startFill;if(!sf||sf.phase!=="tiles")return;
 const pi=sf.order[sf.pos];
 if(sf.placed<sf.needed)log(`Начальный участок игрока ${G.players[pi].name} заполнен не полностью (${sf.placed}/${sf.needed}): подходящих гексов не хватило.`,1);
 sf.pos++;sf.placed=0;sf.needed=0;sf.tile=null;G.sel=null;highlight=[];
 if(sf.pos>=sf.order.length)beginInitialPioneerPhase();else startInitialFillPlayer();
}
function beginInitialPioneerPhase(){
 const sf=G.startFill;if(!sf)return;
 sf.phase="pioneers";sf.pos=0;sf.placed=0;sf.needed=0;sf.tile=null;G.sel=null;highlight=[];
 log(`<b>Этап 2/2. Все стартовые зоны достроены.</b> Теперь каждый игрок бесплатно размещает Пионера силы 1/2 в свободном гексе своей зоны; только затем начинается первый круг.`,1);
 startInitialPioneerPlayer();
}
function initialPioneerSlots(pi){
 const z=zoneOf(pi),out=[];
 G.map.forEach(h=>{
  if(!z.has(K(h.q,h.r))||h.n==="Пески"||!freeHex(h))return;
  out.push([h.q,h.r]);
 });
 return out;
}
function startInitialPioneerPlayer(){
 const sf=G.startFill;if(!sf||sf.phase!=="pioneers")return;
 if(sf.pos>=sf.order.length){startRegularPlay();return;}
 const pi=sf.order[sf.pos];G.cur=pi;G.sel=null;highlight=[];
 if(!initialPioneerSlots(pi).length){
  log(`У игрока ${G.players[pi].name} нет свободного гекса в стартовой зоне для Пионера.`,1);
  finishInitialPioneerPlayer();return;
 }
 if(isHuman(pi)){
  hint(`Этап 2/2: поставьте Пионера силы 1/2 в любой свободный гекс своей достроенной зоны.`);ui();
  if(G.humans>1)askPass(pi);else drawInitialPioneerChoice(pi);
 }else{
  hint(`ИИ ${G.players[pi].name} размещает Пионера в своей зоне.`);ui();
  setTimeout(autoPlaceInitialPioneer,250);
 }
}
function drawInitialPioneerChoice(pi){
 const sf=G.startFill;if(!sf||sf.phase!=="pioneers")return;
 G.cur=pi;G.sel={type:"startpioneer"};highlight=initialPioneerSlots(pi);
 hint(`Выберите любой свободный гекс в своей стартовой зоне для Пионера силы 1/2.`);ui();
}
function commitInitialPioneer(pi,q,r){
 if(!initialPioneerSlots(pi).some(([a,b])=>a===q&&b===r))return false;
 const h=hx(q,r);h.tok={t:"Пионер",o:pi,w:1};
 log(`${G.players[pi].name} разместил Пионера в своей стартовой зоне.`,isHuman(pi));
 return true;
}
function placeInitialPioneer(q,r){
 const sf=G.startFill;if(!sf||sf.phase!=="pioneers")return;
 const pi=sf.order[sf.pos];
 if(!commitInitialPioneer(pi,q,r)){hint("Выберите свободный гекс в своей достроенной зоне.");return;}
 finishInitialPioneerPlayer();
}
function autoPlaceInitialPioneer(){
 const sf=G.startFill;if(!sf||sf.phase!=="pioneers")return;
 const pi=sf.order[sf.pos],slots=initialPioneerSlots(pi),slot=slots.length?rnd(slots):null;
 if(!slot||!commitInitialPioneer(pi,slot[0],slot[1])){
  log(`Не удалось поставить Пионера игрока ${G.players[pi].name}.`,1);
  finishInitialPioneerPlayer();return;
 }
 finishInitialPioneerPlayer();
}
function finishInitialPioneerPlayer(){
 const sf=G.startFill;if(!sf||sf.phase!=="pioneers")return;
 sf.pos++;G.sel=null;highlight=[];
 if(sf.pos>=sf.order.length)startRegularPlay();else startInitialPioneerPlayer();
}
function beginGame(){
 const kinds={};
 let humans=0;
 for(let i=1;i<=SETUP.n;i++){kinds[i]=SETUP.kind[i];if(kinds[i]==="human")humans++;}
 document.getElementById("setup").classList.remove("on");
 initGame(SETUP.n,kinds,SETUP.eventMode==="choice"?{mode:"choice",names:[...SETUP.events]}:{mode:"random"});
 G.humans=humans;
 for(let i=1;i<=G.N;i++)recalc(i);
 draw();
 startInitialFill();
}
addEventListener("resize",()=>{invalidateBoardLayout();if(!userVB)draw();});
addEventListener("orientationchange",()=>{userVB=null;invalidateBoardLayout();setTimeout(draw,250);});
drawSetup();
</script>
