<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110e">
<title>Terra Incognita — игра</title>
<!-- Сгенерировано tools/build.py. Правьте файлы в src/, а не этот блок. -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14110e;color:#e9e0d1;
  font:13.5px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
/* Dynamic viewport keeps the lower controls above mobile browser chrome. */
@supports (height:100dvh){html,body{height:100dvh}}
#top{height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;
  background:#1e1914;border-bottom:1px solid #3c332a;flex:none;
  padding-top:env(safe-area-inset-top)}
#top h1{margin:0;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#e0bd75;white-space:nowrap}
#phase{font-size:12.5px;color:#9d9081;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1;min-width:0;max-width:40vw}
#endturn{margin-left:auto;flex:none;position:relative;z-index:5;
  padding:9px 28px;font-size:14.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  background:#c69648;border:1px solid #e0bd75;color:#1a1410;border-radius:8px;cursor:pointer;
  box-shadow:0 2px 8px rgba(192,150,72,.35)}
#endturn:hover:not(:disabled){background:#e0bd75;border-color:#f4d59a}
#endturn:disabled{background:#3a3022;color:#6e6354;border-color:#4a4030;cursor:not-allowed;box-shadow:none}
 .bgrp{margin:8px 0 4px 0;border:1px solid #4a3f30;border-radius:7px;background:#221a13;overflow:hidden}
 .bgrp>summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:700;letter-spacing:.4px;background:linear-gradient(180deg,#2a201a,#231b15);color:#e6cea0;font-size:13px;text-transform:uppercase}
 .bgrp>summary::-webkit-details-marker{display:none}
 .bgrp>summary::before{content:"▶ ";font-size:11px;color:#a1863f;margin-right:8px;display:inline-block;transition:transform .15s}
 .bgrp[open]>summary::before{content:"▼ ";color:#e0bd75}
 .bgrp .btns2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;background:#1b1611}
 .bgrp .btns2 button{font-size:12.2px;padding:7px 6px;text-align:left;justify-content:flex-start}
 .bgrp>summary:focus{outline:1px solid #a1863f;outline-offset:-2px}
 .bgrp .btns2 button:disabled{opacity:.4}
 .bgrp .grpstat{float:right;color:#a8977a;font-size:10.5px;font-weight:500;text-transform:none;letter-spacing:0}
 .bgrp .groupnote{grid-column:1/-1;color:#9d9081;font-size:11px;line-height:1.35;padding:3px 2px}
 .bgrp .badnote{color:#e79a84}
 .actiongrp{flex:1 1 100%;width:100%}

#wrap{display:flex;height:calc(100% - 42px)}
#boardwrap{flex:1;overflow:hidden;position:relative;
  background:radial-gradient(circle at 45% 40%,#1d1813,#100e0c 75%);touch-action:none}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg.drag{cursor:grabbing}
aside{width:340px;flex:none;background:#181410;border-left:1px solid #3c332a;
  display:flex;flex-direction:column;min-height:0;overflow-x:hidden;overflow-y:scroll;
  overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:thin;
  scrollbar-color:#a1863f #1b1712}
aside::-webkit-scrollbar{width:11px}
aside::-webkit-scrollbar-track{background:#1b1712;border-left:1px solid #2b241d}
aside::-webkit-scrollbar-thumb{background:#6f5a32;border:2px solid #1b1712;border-radius:8px}
aside::-webkit-scrollbar-thumb:hover{background:#a1863f}
.sect{padding:9px 12px;border-bottom:1px solid #2b241d;flex:none}
.sect h2{margin:0 0 6px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#a3873f}
#log{flex:1;overflow-y:auto;padding:9px 12px;font-size:12.3px;color:#c3b5a1;
  -webkit-overflow-scrolling:touch;min-height:0}
#log div{margin-bottom:4px;padding-left:9px;border-left:2px solid #3a3129}
#log b{color:#e0bd75}
#log .hi{border-left-color:#c07a3a;color:#eddcc0}
.p1{color:#6fb4ef}.p2{color:#ef8a66}.p3{color:#84cf8b}.p4{color:#c79ee3}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:1px 0}td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
td.bad{color:#ff7d6b}
.cards{display:flex;flex-wrap:wrap;gap:5px}
.card{padding:6px 9px;border:1px solid #4a3e31;border-radius:6px;background:#231d17;
  cursor:pointer;font-size:12.4px;transition:.12s}
.card:hover{background:#2f271e;border-color:#7d6a4a}
.card.sel{background:#5a4322;border-color:#e0bd75;color:#ffeec4}
.card small{display:block;color:#93856f;font-size:10.6px}
button{font:inherit;padding:7px 11px;border:1px solid #4a3e31;border-radius:6px;
  background:#241e17;color:#e9e0d1;cursor:pointer;transition:.12s;touch-action:manipulation}
button:hover:not(:disabled){background:#33291f;border-color:#8a7450}
button:disabled{opacity:.3;cursor:default}
button.go{background:#5d4a22;border-color:#a1863f;color:#ffeec4}
.btns{display:flex;flex-wrap:wrap;gap:5px}
#hint{padding:7px 12px;background:#241d14;border-bottom:1px solid #3c332a;
  font-size:12.3px;color:#e3c98f;min-height:34px;flex:none}
.pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10.8px;
  background:#2c241c;border:1px solid #453a2e;margin:1px 2px 0 0;color:#bdae98}
text{pointer-events:none;user-select:none;font-family:system-ui,sans-serif}
/* Карта рисуется плоским набором SVG-слоёв. Иконки жетонов, гарнизона и
   построек лежат поверх контура гекса и раньше перехватывали касание. Все
   декоративные слои пропускают событие к верхней прозрачной hit-area. */
#svg>g>*:not(.clickable){pointer-events:none}
.clickable{cursor:pointer;pointer-events:all}
.clickable:hover{filter:brightness(1.4)}
.hex-hit:hover{filter:none}
#end{position:absolute;inset:0;background:rgba(12,10,8,.93);display:none;
  flex-direction:column;align-items:center;gap:10px;z-index:9;padding:18px;overflow-y:auto;text-align:center}
#end h2{color:#e0bd75;margin:0;font-size:24px}
#end p{margin:0;font-size:15px}
#end>button{flex:none}
#endstats{width:min(980px,100%)}
.final-stats{text-align:left}
.final-chart-title{margin:4px 0 8px;color:#e0bd75;font-size:15px;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.final-bars{display:grid;gap:8px;padding:10px 12px;border:1px solid #4a3f30;border-radius:9px;background:rgba(27,22,17,.92)}
.final-bar-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700}
.final-bar-track{height:14px;margin-top:4px;overflow:hidden;border:1px solid #5b4c38;border-radius:999px;background:#17130f}
.final-bar-fill{height:100%;min-width:0;border-radius:inherit;transition:width .25s ease}
.final-note{margin:7px 2px 10px;color:#9d9081;font-size:11.5px;text-align:center}
.final-player{margin-top:10px;padding:10px 12px;border:1px solid #4a3f30;border-radius:9px;background:rgba(27,22,17,.92)}
.final-player h3{display:flex;justify-content:space-between;gap:12px;margin:0 0 7px;font-size:15px}
.final-meta{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:#bdae98;font-size:12px}
.final-player td{padding:3px 0;border-bottom:1px solid #2b241d}
.final-player tr:last-child td{border-bottom:0}
.final-player .cnt{color:#93856f;font-size:11px}
.final-player .good{color:#9bd18b}
.final-player .bad{color:#ff8f7d}
@media (max-width:820px){
  #end{align-items:stretch;padding:12px}
  #end h2,#end p{text-align:center}
  #end>button{align-self:center}
}
#tabs{display:none}
/* На компьютере вся боковая колонка имеет естественную высоту и прокручивается
   единым нативным бегунком; колесо мыши работает над любой её секцией. */
.pane{flex:none}
.actionjump{display:none}
/* компактная колонка шкал поверх поля, слева сверху */
#hud{position:absolute;left:8px;top:8px;z-index:6;background:rgba(16,13,10,.86);
  border:1px solid #3a322a;border-radius:9px;padding:6px 8px;font-size:12px;
  pointer-events:none;user-select:none;min-width:104px}
#hud .who{font-weight:700;font-size:11px;letter-spacing:.04em;margin-bottom:3px}
#hud .r{display:flex;justify-content:space-between;gap:10px;line-height:1.5}
#hud .r span:first-child{color:#9d9081}
#hud .v{font-weight:700;color:#e8ddc8}
#hud .v.bad{color:#f0a08c}
#hud .vp{border-top:1px solid #3a322a;margin-top:3px;padding-top:3px}
/* Торговля — полноценный экранный диалог. Раньше он был absolute внутри поля:
   на телефоне открывался в верхней части экрана, а активный #pick с тем же
   z-index мог полностью его перекрыть, из-за чего кнопка выглядела сломанной. */
#trade{position:fixed;inset:0;background:rgba(12,10,8,.97);display:none;
  flex-direction:column;align-items:center;gap:10px;z-index:19;padding:16px;
  overflow-y:auto;overscroll-behavior:contain}
#trade.on{display:flex}
#trade h2{color:#e0bd75;margin:0;font-size:19px;text-align:center}
#trade>.sub,#trade>.have,#trade>.sect,#trade>.bar{width:min(920px,100%)}
#trade .sub{color:#9d9081;font-size:12.5px;text-align:center;margin:-4px 0 2px}
#trade .sect{border:1px solid #3a322a;border-radius:9px;padding:10px 11px}
#trade .sect h3{margin:0 0 7px;font-size:13px;color:#e0bd75;font-weight:700;letter-spacing:.03em}
#trade .row{display:flex;gap:7px;flex-wrap:wrap}
#trade .row button{padding:8px 11px;font-size:13px}
#trade .note{color:#93856f;font-size:12px;margin-top:6px;line-height:1.45}
#trade .have{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:#c9bda9}
#trade .have b{color:#e8ddc8}
#trade .bar{display:flex;gap:8px;justify-content:center;margin-top:2px}
#trade .lock{color:#a14f3f;font-size:12.5px}
#battle{position:absolute;inset:0;background:rgba(12,10,8,.96);display:none;
  flex-direction:column;gap:8px;z-index:12;padding:14px;overflow-y:auto}
#battle.on{display:flex}
#battle h2{color:#e0bd75;margin:0;font-size:18px;text-align:center}
#battle .side{border:1px solid #3a322a;border-radius:8px;padding:8px}
#battle .side h3{margin:0 0 6px;font-size:13px;color:#9d9081;font-weight:600}
#battle .units{display:flex;gap:6px;flex-wrap:wrap}
#battle .u{border:1px solid #4a4036;border-radius:7px;padding:7px 9px;font-size:13px;
  background:#1c1814;cursor:default;min-width:84px;text-align:center}
#battle .u.me{border-color:#5d7a4a}
#battle .u.foe{border-color:#8a4a3f}
#battle .u.pick{outline:2px solid #e0bd75;cursor:pointer}
#pick{position:absolute;inset:0;background:rgba(12,10,8,.94);display:none;
  flex-direction:column;gap:10px;z-index:13;padding:16px;overflow-y:auto}
#pick.on{display:flex}
#pick h2{color:#e0bd75;margin:0;font-size:18px;text-align:center}
#pick .opt{border:1px solid #3a322a;border-radius:9px;padding:10px 12px;font-size:13.5px;
  line-height:1.5}
#pick .opt button{margin-right:8px}
#pick .why{color:#a14f3f;font-size:12.5px}
#pick .bar{display:flex;gap:8px;justify-content:center;margin-top:4px}
#battle .u.sel{background:#3a3222;border-color:#e0bd75}
#battle .u.dead{opacity:.32;text-decoration:line-through}
#battle .u small{display:block;color:#9d9081;font-size:11px}
#battle .bline{margin-top:6px;padding:6px 8px;border:1px dashed #3e3428;border-radius:7px;background:rgba(20,16,12,.55)}
#battle .bline:first-child{margin-top:0}
#battle .bline-hd{font-size:11.5px;color:#c9b48a;font-weight:700;letter-spacing:.04em;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between}
#battle .linebtn{display:inline-block;margin-top:4px;padding:2px 6px;font-size:10.5px;border-radius:4px;border:1px solid #6b5839;background:#2a2218;color:#e0bd75;cursor:pointer}
#battle .linebtn:hover{background:#3d3020;border-color:#c69648}
#battle .blog{flex:1;min-height:60px;font-size:12.5px;line-height:1.5;color:#c9bda9;
  border-top:1px solid #3a322a;padding-top:6px}
#battle .blog div{margin-bottom:2px}
#battle .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#battle .wall{text-align:center;font-size:13px;color:#e0bd75}
#setup,#pass{position:fixed;inset:0;background:#14110e;z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;
  text-align:center;overflow-y:auto}
#setup.on,#pass.on{display:flex}
#setup h2,#pass h2{color:#e0bd75;margin:0;font-size:21px;letter-spacing:.04em}
#setup .sub{color:#9d9081;font-size:13px;margin:0;max-width:340px}
#setup .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#setup .cnt button{min-width:52px;font-size:17px;padding:11px 15px}
#setup .cnt button.on{background:#5d4a22;border-color:#e0bd75;color:#ffeec4}
#plist{display:flex;flex-direction:column;gap:9px;width:100%;max-width:340px}
.prow{display:flex;align-items:center;gap:9px;background:#1d1812;border:1px solid #3c332a;
  border-radius:9px;padding:9px 11px}
.prow .dot{width:15px;height:15px;border-radius:50%;flex:none}
.prow .nm{flex:1;text-align:left;font-size:14px}
.prow .nminp{flex:1;min-width:70px;background:#17130f;color:#e8ddc8;border:1px solid #4a4036;
  border-radius:7px;padding:7px 9px;font-size:13.5px;font-family:inherit}
.prow .nminp:focus{outline:none;border-color:#e0bd75}
.prow .nminp::placeholder{color:#6f6458}
.prow .tg{display:flex;gap:5px}
.prow .tg button{padding:7px 12px;font-size:12.5px}
.prow .tg button.on{background:#5d4a22;border-color:#e0bd75;color:#ffeec4}
#pass .who{font-size:27px;font-weight:700}
#pass button{font-size:17px;padding:14px 28px}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:40px;height:40px;padding:0;font-size:20px;line-height:1;
  background:rgba(30,25,20,.9);border-color:#5a4c3c}

/* ================= МОБИЛЬНАЯ ВЁРСТКА ================= */
@media (max-width:820px){
  html,body{font-size:15px}
  #top{height:46px;gap:8px;padding:0 10px}
  #top h1{font-size:11.5px;letter-spacing:.1em}
  #phase{font-size:11.5px}
  #wrap{flex-direction:column;height:calc(100% - 46px)}
  @supports (height:100dvh){#wrap{height:calc(100dvh - 46px)}}
  #boardwrap{flex:1 1 auto;min-height:38vh}
  aside{width:100%;border-left:0;border-top:1px solid #3c332a;
    height:46vh;flex:none;min-height:0;overflow:hidden;scrollbar-gutter:auto;scrollbar-width:auto}
  /* вкладки снизу */
  #tabs{display:flex;flex:none;border-bottom:1px solid #3c332a;background:#1b1712}
  #tabs button{flex:1;border:0;border-radius:0;padding:10px 4px;font-size:12.5px;
    background:transparent;color:#9d9081;border-bottom:2px solid transparent}
  #tabs button.on{color:#e0bd75;border-bottom-color:#a1863f;background:#241d14}
  /* Safari/Chrome on phones need an explicit zero flex basis and their own vertical
     gesture area; otherwise the document body (which is intentionally locked for
     the map) can swallow the swipe before the last action groups are reached. */
  .pane{display:none;position:relative;flex:1 1 0;height:0;min-height:0;max-height:100%;
    overflow-x:hidden;overflow-y:scroll;-webkit-overflow-scrolling:touch;
    touch-action:pan-y;overscroll-behavior:contain;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    scroll-padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .pane.on{display:block}
  #hint{font-size:13px;min-height:0;max-height:78px;padding:8px 12px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:none}
  .actionjump{display:flex;position:sticky;top:0;z-index:5;gap:5px;overflow-x:auto;
    margin:0 -2px 8px;padding:4px 2px 7px;background:#181410;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .actionjump::-webkit-scrollbar{display:none}
  .actionjump button{flex:0 0 auto;min-height:38px;padding:7px 10px;font-size:12px;white-space:nowrap}
  .actionjump button.go{order:-1}
  .sect{border-bottom:0}
  .card{padding:9px 12px;font-size:14px;border-radius:8px}
  .card small{font-size:11.5px}
  button{padding:10px 13px;font-size:13.5px;border-radius:8px}
  .btns{gap:7px}
  .btns button{flex:1 1 calc(50% - 7px);min-height:44px}
  .btns button.go{flex:1 1 100%}
  table{font-size:14px}
  #log{font-size:13px;padding:10px 12px}
  #zoom{right:8px;bottom:8px}
  #zoom button{width:46px;height:46px;font-size:22px}
}
@media (max-width:820px) and (orientation:landscape){
  #wrap{flex-direction:row}
  aside{width:300px;height:auto;border-top:0;border-left:1px solid #3c332a}
  #boardwrap{min-height:0}
}
  /* Значок ресурса идёт в строку с текстом и не должен растягиваться:
     задаём размер явно, иначе его подомнёт общее правило для svg. */
  .ic{width:1.05em;height:1.05em;display:inline-block;vertical-align:-0.15em;
      margin-right:4px;flex:0 0 auto}
</style>
</head>
<body>

<script>
// ============ УТИЛИТЫ =============
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const K=(q,r)=>q+","+r;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ============ ДАННЫЕ =============
// grp: field forest mount desert water lair; event = особый гекс без биома
// Обычный каталог содержит 160 гексов. Отдельно лежат десять гексов событий:
// две «Старые карты» и по одному красному гексу «Ошибка картографов», «Нашествие»,
// «Новые горизонты», «Второй шанс», «Смерть», «Сокровища», «Край мира» и «Престиж».
// В каждой партии участвуют 3 / 4 / 5 гексов событий по числу игроков:
// случайные либо выбранные игроками в стартовых настройках. Из 160 обычных
// гексов выбираются ровно 120 / 135 / 150, затем события замешиваются сверху;
// активная колода содержит 123 / 139 / 155 гексов, обычный отсев равен
// 40 / 25 / 10, а остальные 7 / 6 / 5 событий в партию не входят.
const TERR=[

const tokWho=t=>{const T=TOKENS[t];return (T&&T.who)||[];};
const tokenFits=(t,name)=>tokWho(t).includes(name);
// Покупка жетона из панели действий
function buyTokenPrompt(name){
 if(phaseLocked())return;
 if(!canBuyToken(ME(),name)){hint(`Сейчас купить «${name}» нельзя — нет ресурса или рука забита.`);ui();return;}
 const t=TOKENS[name];
 const parts=[];
 for(const k in t.buy)parts.push(`${t.buy[k]} ${resLabel(k)}`);
 hint(`Купить «${name}» за ${parts.join(' + ')}? <button onclick="doBuyToken('${name}')">Купить</button> <button onclick="cancelBuyToken()">Отмена</button>`);
 ui();
}
function doBuyToken(name){buyToken(ME(),name);hint(`${name} лежит в руке. Сожгите его в бою — даст воину максимальную силу.`);ui();}
function cancelBuyToken(){hint("Отменено.");ui();}
// Сжечь жетон из руки (выкинуть) - на случай если игрок передумал
function burnToken(i){
 if(phaseLocked())return;
 const p=G.players[ME()],c=p.handRes[i];
 if(!isToken(c)){hint("Это не жетон усиления.");ui();return;}
 p.handRes.splice(i,1);
 log(`<b>${c}</b> сожжён без боя — выброшен из руки.`,1);
 ui();
}

// Вспомогательное: сжечь жетон по имени (без индекса)
function burnTokFromHand(name){
 const p=G.players[ME()],i=p.handRes.indexOf(name);
 if(i<0)return false;
 p.handRes.splice(i,1);
 return true;
}

function canBuyToken(pi,name){
 const p=G.players[pi],t=TOKENS[name];
 if(!p||!t)return false;
 if(p.handRes.length>=3)return false;
 if(anyDebt(p))return false;
 for(const k in t.buy){if((p[k]||0)<t.buy[k])return false;}
 return true;
}
function buyToken(pi,name){
 const p=G.players[pi],t=TOKENS[name];
 if(!canBuyToken(pi,name))return false;
 for(const k in t.buy){p[k]-=t.buy[k];}
 p.handRes.push(name);
 const buys=name==="Колчан"?"куплен":(name==="Доспехи"?"куплены":"куплено");
  log(`<b>${name}</b> ${buys}. Содержание ${resLabel(name)}; лежит в руке, пока не сгорит в бою.`,1);
 return true;
}
// Содержание жетонов в конце хода
function tokenUpkeep(p){
 const out={wood:0,stone:0,steel:0,gold:0};
 p.handRes.forEach(c=>{
  const t=TOKENS[c]; if(!t)return;
  for(const k in t.upkeep)out[k]+=t.upkeep[k];
 });
 return out;
}
function upkeepTokens(pi){
 const p=G.players[pi];
 const out=[];
 p.handRes.slice().forEach((c,i)=>{
  if(!isToken(c))return;
  const t=TOKENS[c];
  for(const k in t.upkeep){if((p[k]||0)<t.upkeep[k]){out.push({c,need:t.upkeep[k],res:k});return;}}
 });
 out.forEach(x=>{log(`Жетон <b>${x.c}</b> не получил ${x.need} ${resLabel(x.res)} содержания — остаётся в руке.`,1);});
}

// Вся ветка улучшений Обывателя, включая самого Обывателя и последующие
// формы Лавочник → Купец, Вор → Ассасин и Знахарь → Лекарь, получает единое
// дополнительное правило размещения в пустыне рядом с водой.
const COMMONER_DESERT_RULES=Object.freeze({
 root:"Обыватель",includeRoot:true,includeDescendants:true,
 biome:"desert",requiresAdjacentWater:true,includesBaseSands:true
});
function residentUpgradeFamily(root){
 const seen=new Set(),queue=[root];
 while(queue.length){
  const name=queue.shift();if(seen.has(name)||!RES[name])continue;
  seen.add(name);
  ((RESUP[name]&&RESUP[name].to)||[]).forEach(to=>{if(!seen.has(to))queue.push(to);});
 }
 return [...seen];
}
const COMMONER_RESIDENT_BRANCH=Object.freeze(residentUpgradeFamily(COMMONER_DESERT_RULES.root));
const commonerBranchResident=name=>COMMONER_RESIDENT_BRANCH.includes(name);
function resUpCost(from,to){
 const p=RESUP[from];if(!p||!p.to.includes(to))return 0;
 if(/★$/.test(to))return RES_STAR_UPGRADE_COST;
 return RES_UPGRADE_COST[(RES[to]||{}).tier]||0;
}
function resUpSteel(){return 0;}
function resUpWood(){return 0;}

const VP_SOURCE_LABELS=Object.freeze({

const VP_LEDGER_ORDER=["scout_success","scout_failure","battle_victory","battle_losses","invasion_defense",

 "exile","liberation","score_floor"];
function vpLedgerFor(pi){
 if(!G.vpLedger||typeof G.vpLedger!=="object")G.vpLedger={};
 if(!G.vpLedger[pi]||typeof G.vpLedger[pi]!=="object")G.vpLedger[pi]={};
 return G.vpLedger[pi];
}
function recordVP(pi,delta,source){
 delta=Number(delta)||0;if(!delta||!G.players||!G.players[pi])return 0;

 const ledger=vpLedgerFor(pi),row=ledger[source]||(ledger[source]={points:0,count:0});

function changeVP(playerOrPi,delta,source){

function totalVPraw(p){

 return p.vp + settleVP(p.i) + resVP(p.i) + tier3Count(p.i) + (p.gold<0 ? p.gold*2 : 0);

// Финальная расшифровка всегда сводится к тому же totalVP, который использует
// победа. Накопительные действия берутся из журнала, а текущие постройки,
// жители и долг рассчитываются по финальному состоянию поля.
function finalVPBreakdown(pi){
 const p=G.players&&G.players[pi];if(!p)return null;
 const rows=[],ledger=vpLedgerFor(pi),known=new Set(VP_LEDGER_ORDER);
 const add=(key,points,count,kind)=>{
  points=Number(points)||0;if(!points)return;
  rows.push({key,label:VP_SOURCE_LABELS[key]||key,points,count:Number(count)||0,kind:kind||"event"});
 };
 VP_LEDGER_ORDER.forEach(key=>{const row=ledger[key];if(row)add(key,row.points,row.count,"event");});
 Object.keys(ledger).filter(key=>!known.has(key)).sort().forEach(key=>{
  const row=ledger[key];if(row)add(key,row.points,row.count,"event");
 });
 const recorded=Object.values(ledger).reduce((sum,row)=>sum+(Number(row&&row.points)||0),0);
 add("other",(Number(p.vp)||0)-recorded,0,"adjustment");
 let outposts=0,fortresses=0,monuments=0,monumentPoints=0,residentPoints=0,residentN=0,tier3=0;
 G.map.forEach(h=>{
  if(h.bld&&h.bld.k==="city"&&settlementController(h)===pi){
   const lv=h.bld.lv||1;if(lv===2)outposts++;else if(lv===3)fortresses++;
  }
  if(h.bld&&h.bld.k==="monument"&&h.bld.o===pi){
   const stage=monumentStageData(monumentStage(h));if(stage){monuments++;monumentPoints+=stage.vp||0;}
  }
  if(!(h.tok&&h.tok.o===pi&&!h.tok.w))return;
  const anchor=residentSettlementAt(h.q,h.r);if(anchor&&postBanditOccupied(anchor))return;
  const R=RES[h.tok.t]||{};
  if(R.vp){residentPoints+=R.vp;residentN++;}
  if(R.tier===3)tier3++;
 });
 add("outposts",outposts*2,outposts,"current");

 add("resident_bonus",residentPoints,residentN,"current");
 add("tier3_residents",tier3,tier3,"current");
 if((Number(p.gold)||0)<0)add("gold_debt",p.gold*2,Math.abs(p.gold),"current");
 let sum=rows.reduce((n,row)=>n+row.points,0),canonical=totalVP(p);
 if(sum<0){add("total_floor",-sum,0,"adjustment");sum=0;}
 if(sum!==canonical)add("score_sync",canonical-sum,0,"adjustment");

  positive:rows.reduce((n,row)=>n+(row.points>0?row.points:0),0),
  negative:rows.reduce((n,row)=>n+(row.points<0?-row.points:0),0)};
}
function finalVPStatistics(){
 const out=[];for(let pi=1;pi<=G.N;pi++){const row=finalVPBreakdown(pi);if(row)out.push(row);}return out;
}
// На Посту один внешний слот отведён жителю, а воины находятся только во
// внутреннем гарнизоне. Старые состояния с внешним воином исправляются без штрафа.
function normalizePostOccupants(){

  if(!h.post||!h.tok||h.tok.def||!h.tok.w)return; // законный житель остаётся на Посту
  const tok=h.tok,owner=Number(tok.o),holder=G.players&&G.players[owner];
  h.tok=null;
  if(canStationIn(h,owner,tok.t)){
   garList(h).push(tok);
   if(G.started)log(`${holder?holder.name:"Игрок"}: <b>${tok.t}</b> переведён с Поста во внутренний гарнизон.`,isHuman(owner));
  }else if(G.started){
   log(`${holder?holder.name:"Игрок"}: <b>${tok.t}</b> покинул Пост — эта фишка не может находиться в его гарнизоне.`,isHuman(owner));
  }
 });
}
// Миграция старых/временных состояний к канону гарнизонов: обычный воин,
// оказавшийся на внешнем гексе, переходит в ближайшее подконтрольное поселение.
// Если все гарнизоны заполнены, недопустимая внешняя фишка возвращается в личный запас.
function normalizeWarriorStations(pi){
 const stranded=[];
 G.map.forEach(h=>{
  const t=h.tok;
  if(!t||!t.w||t.o!==pi||t.def||t.revolt||!requiresGarrisonType(t.t))return;
  stranded.push(h);
 });
 stranded.forEach(from=>{
  const wt=from.tok;if(!wt)return;
  const choices=controlledCityAnchors(pi)
   .filter(a=>isGarrisonPost(a)&&canStationIn(a,pi,wt.t))
   .sort((a,b)=>hexDist(from.q,from.r,a.q,a.r)-hexDist(from.q,from.r,b.q,b.r));
  from.tok=null;
  if(choices.length&&placeWarriorOnHex(choices[0],wt)){
   if(G.started)log(`${G.players[pi].name}: <b>${wt.t}</b> переведён с внешнего гекса в гарнизон «${choices[0].n}».`,isHuman(pi));
  }else if(G.started){
   log(`${G.players[pi].name}: <b>${wt.t}</b> возвращён в личный запас — свободного гарнизона нет.`,isHuman(pi));
  }
 });
}
// Рыцарь замка и Князь города привязаны к номеру своего поселения.
// Они могут уйти в армию; пока жетон жив в гарнизоне, армии или на поле, второй
// экземпляр не появляется. Монумент автоматического защитника больше не даёт.
function syncDefenders(pi){
 normalizePostOccupants();
 normalizeWarriorStations(pi);
 const cities=[];
 G.map.forEach(h=>{
  if(h.bld&&h.bld.k==="city"&&settlementOwner(h)===pi&&settlementController(h)===pi)cities.push(h);
  // Старые автоматические защитники Монумента полностью удалены из игры.
  if(h.bld&&h.bld.k==="monument"&&h.tok&&h.tok.def&&isLeaderToken(h.tok))h.tok=null;
 });
 cities.forEach(h=>{
  ensureSettlementNumber(h);
  if(h.tok&&!h.tok.def&&h.tok.w&&!isLeaderToken(h.tok)){garList(h).push(h.tok);h.tok=null;}
  if(!leaderTypeForSettlement(h))return;
  const key=K(h.q,h.r),num=settlementNumber(h);
  const existing=leaderTokensOnMap(pi).filter(x=>x.tok.home===key||(!x.tok.home&&x.hex===h));
  existing.forEach(x=>{x.tok.num=num;x.tok.home=key;x.tok.leader=1;x.tok.def=0;});
  const p=G.players&&G.players[pi];
  const pending=!!(p&&Array.isArray(p.leaderDead)&&p.leaderDead.some(x=>x&&x.home===key));
  const princeLost=!!(p&&Array.isArray(p.leaderLostHomes)&&p.leaderLostHomes.includes(key));
  if(!existing.length&&!pending&&!princeLost&&!h.tok)h.tok=makeLeaderToken(h,pi);
 });
 // Лидер без действующего родного поселения уровня 2/3 покидает поле; если
 // поселение просто оккупировано, находящийся вне дома лидер не уничтожается.
 G.map.forEach(h=>{
  if(!isGarrisonPost(h)&&h.gar&&h.gar.length)h.gar=[];
 });
 leaderTokensOnMap(pi).forEach(x=>{
  const home=x.tok.home?hx(...String(x.tok.home).split(",").map(Number)):x.hex;
  // Лидер, оставшийся на гексе захваченного дома, считается потерявшим пост и
  // сможет восстановиться после освобождения поселения; лидер в армии жив.
  if(x.where==="hex"&&home&&x.hex===home&&settlementController(home)!==Number(pi)){
   recordLeaderDeath(x.tok);x.hex.tok=null;return;
  }
  if(home&&home.bld&&home.bld.k==="city"&&Number(home.bld.o)===Number(pi)&&leaderTypeForSettlement(home))return;
  if(x.where==="hex"&&x.hex.tok===x.tok)x.hex.tok=null;
  else if(x.where==="gar"&&x.hex.gar)x.hex.gar=x.hex.gar.filter(t=>t!==x.tok);
  else if(x.where==="army"&&x.army&&Array.isArray(x.army.members)){x.army.members=x.army.members.filter(t=>t!==x.tok);if(!x.army.members.length)delete x.hex.army;}
  const holder=G.players&&G.players[pi];
  if(G.started)log(`${holder?holder.name:"Игрок"}: ${x.tok.t} ${x.tok.num||""} покинул поле — родное поселение больше не действует.`,isHuman(pi));
 });
 // Жители принадлежат действующему контролёру поселения только для эффектов и зоны.
 // Идентичность токена остаётся прежней; разведчики по-прежнему подчиняются владельцу.
 const z=residentZoneOf(pi),fz=foeZones(pi);
 G.map.forEach(h=>{
  if(!(h.tok&&!h.tok.w)||residentEffectOwner(h)!==pi)return;
  if(z.has(K(h.q,h.r)))return;
  returnTokToBag(h.tok.t);
  log(`${G.players[pi].name}: ${h.tok.t} остался вне зоны и ушёл в стопку.`,isHuman(pi));
  h.tok=null;
 });
}
function recalc(pi){
 const p=G.players[pi];
 if(G.started)syncDefenders(pi);
 let f=0,w=0,s=0,st=0,g=0;
 G.map.forEach(h=>{
   const addWar=wt=>{
    if(wt&&wt.o===pi&&wt.w){
     const W=WAR[wt.t];
     if(W){f+=W.food||0;if(W.wood)w+=W.wood;if(W.stone)s+=W.stone;if(W.steel)st+=W.steel;if(W.gold)g+=W.gold;}
    }
   };
   (h.gar||[]).forEach(addWar);
   (h.army&&h.army.members||[]).forEach(addWar);
   // Трофеи в резерве не занимают гарнизонных мест, но содержатся текущим
   // контролёром так же, как орудия в поле или в армии.
   (h.siegeReserve||[]).forEach(addWar);
   const t=h.tok; if(!t)return;
   if(t.w){ // воин или осадное орудие
     if(t.o!==pi)return;
     const W=WAR[t.t]; if(W){f+=W.food||0; if(W.wood)w+=W.wood; if(W.stone)s+=W.stone; if(W.steel)st+=W.steel; if(W.gold)g+=W.gold;}
     return;
   }
   if(residentEffectOwner(h)!==pi)return;
   const R=RES[t.t]; if(!R)return;
   let d={...R.d};
   if(R.alt&&R.alt[h.n]!==undefined){d={...d,food:R.alt[h.n]};}
   if(t.t==="Шахтёр"&&h.n==="Золотая жила"){d={food:-1,wood:-1,gold:1};}
   if(t.t==="Шахтёр"&&h.n==="Горы"){d={food:-1,wood:-1,stone:2};}
   if(t.t==="Шахтёр★"&&h.n==="Горы"){d={food:-1,wood:-1,stone:3};}
   f+=d.food||0;w+=d.wood||0;s+=d.stone||0;st+=d.steel||0;g+=d.gold||0;
 });
 // Редкий резерв игрока используется, только если на карте нет доступного
 // собственного гарнизона; лимита мест у него также нет.
 (p.siegeTrophies||[]).forEach(wt=>{
  if(!wt||Number(wt.o)!==Number(pi)||!isSiege(wt.t))return;
  const W=WAR[wt.t];if(!W)return;
  f+=W.food||0;w+=W.wood||0;s+=W.stone||0;st+=W.steel||0;g+=W.gold||0;
 });
 // ЗАГОТОВЩИКИ: +1 дерево за каждого своего лесоруба в своей зоне, +1 камень — за шахтёра
 {const has=n=>{for(const h of G.map.values())if(h.tok&&residentEffectOwner(h)===pi&&!h.tok.w&&h.tok.t===n)return true;return false;};
  const cnt=re=>{let n=0;G.map.forEach(h=>{if(h.tok&&residentEffectOwner(h)===pi&&!h.tok.w&&re.test(h.tok.t)&&residentAnchorFor(pi,h.q,h.r))n++;});return n;};
  if(has("Лесозаготовщик"))w+=cnt(/^Лесоруб★?$/);
  if(has("Геолог"))s+=cnt(/^Шахтёр★?$/);}
 // ПОВАР: бонус производителей еды в том же фактически контролируемом поселении.
 {const foodOf=(t,hex)=>{const R=RES[t];if(!R)return 0;
   let fd=(R.d&&R.d.food)||0;
   if(R.alt&&R.alt[hex.n]!==undefined)fd=R.alt[hex.n];
   return fd;};
  G.map.forEach(ph=>{
   if(!(ph.tok&&residentEffectOwner(ph)===pi&&!ph.tok.w&&ph.tok.t==="Повар"))return;
   const a=residentAnchorFor(pi,ph.q,ph.r); if(!a)return;
   const ak=K(a.q,a.r);
   G.map.forEach(h=>{
    if(!(h.tok&&residentEffectOwner(h)===pi&&!h.tok.w))return;
    if(h.tok.t==="Повар")return;
    const a2=residentAnchorFor(pi,h.q,h.r);
    if(!a2||K(a2.q,a2.r)!==ak)return;
    if(foodOf(h.tok.t,h)>0)f++;
   });
  });
 }
 f-=p.handRes.length; // каждый житель в руке потребляет 1 еду
 // ПОТОК за круг (сколько принесут жетоны в конце круга)
 // СОДЕРЖАНИЕ ПОСТРОЕК: домик ест 1 дерево (каждый круг).
 // АРХИТЕКТОР снимает содержание со всех построек того города, в зоне которого стоит.
 const freeCities=[];     // города, чьи постройки содержатся бесплатно
 G.map.forEach(h=>{
  if(!(h.tok&&residentEffectOwner(h)===pi&&!h.tok.w&&h.tok.t==="Архитектор"))return;
  const a=residentAnchorFor(pi,h.q,h.r);
  if(a)freeCities.push(K(a.q,a.r));
 });
 // Содержание поселения оплачивает текущий контролёр; Архитектор отменяет его плату.
 // Само здание, его уровень и право строительства остаются у владельца.
 let nset=0,monStone=0,monGold=0;
 G.map.forEach(h=>{
  if(h.bld&&h.bld.o===pi&&h.bld.k==="monument"){
   const stage=monumentStageData(monumentStage(h));
   if(stage){monStone+=stage.stoneUpkeep||0;monGold+=stage.goldIncome||0;}
   return;
  }
  if(!(h.bld&&h.bld.k==="city"))return;
  if(h.bld.o===pi)nset++;
  if(settlementController(h)!==pi)return;
  if(freeCities.includes(K(h.q,h.r)))return;
  const lv=settlementLevel(h);
  if(lv===1)w-=1; else if(lv===2){w-=1;s-=1;} else {w-=2;s-=2;}
 });
 s-=monStone;g+=monGold;       // Монумент: I −1 камень; II −2; III −2 и +1 золото
 p.houses=0;p.cities=nset+postCount(pi);
 p.inFood=f;p.inWood=w;p.inStone=s;p.inSteel=st;p.inGold=g;
 // Еда — склад, как дерево и камень: приход круга прибавляется к запасу (см. collectIncome).
 // Границы те же: −5…+10.
 p.food=clampRes(p.food);
 // Дерево/камень/сталь/золото — СКЛАД: меняется только приходом и тратами
 p.wood =clampRes(p.wood);
 p.stone=clampRes(p.stone);
 p.steel=clampRes(p.steel);
 p.gold =Math.max(-5,Math.min(CAP,p.gold));
 p.pioneers=pioneerCount(pi);
 p.scouting=activePioneerCount(pi);
 vpFloor(p);
}
function recalcAllActive(){
 for(let pi=1;pi<=G.N;pi++)if(!G.out||!G.out[pi])recalc(pi);
}

// потраченные ресурсы храним отдельными аккумуляторами
const TRADECOST={wood:2,stone:2,steel:3,food:1};  // покупка одной единицы
const TRADERU={food:"еду",wood:"дерево",stone:"камень",steel:"сталь"};
// Продажа всегда приносит 1 золото, но требует полный указанный набор ресурса.
const TRADESELL={food:3,wood:2,stone:2,steel:1};
const TRADESELL_RU={food:"еды",wood:"дерева",stone:"камня",steel:"сталь"};
const SELLPRICE=1;
const METROPOLE_VP={gold:2};                     // отправка 10 золота в метрополию
// Торговый канон хода: каждый действующий Лавочник или Купец даёт одно
// действие на разовую покупку, продажу, метрополию или покупку одного коня.
// Постоянных торговых потоков в игре больше нет.
function traderCounts(pi){
 const out={shops:0,merchants:0};
 G.map.forEach(h=>{
  if(!(h.tok&&!h.tok.w&&residentEffectOwner(h)===pi))return;
  if(h.tok.t==="Лавочник")out.shops++;
  else if(h.tok.t==="Купец")out.merchants++;
 });
 return out;
}
function tradeRights(pi){const c=traderCounts(pi);return c.shops+c.merchants;}
const CAP=10;   // потолок запаса
const FLOOR=-5; // глубже долг не уходит
function clampRes(v){return Math.max(FLOOR,Math.min(CAP,v||0));}
// Животные — отдельные хранимые ресурсы: кони (до 2), медведь (1), скорпион (1).
const ANIMAL_CAP={horses:2,bears:1,scorpions:1};
const ANIMAL_RU={horses:"конь",bears:"медведь",scorpions:"скорпион"};
function animalCount(p,k){return Math.max(0,Math.min(ANIMAL_CAP[k]||0,Number(p&&p[k])||0));}
// Расчищенные гексы-источники в своей зоне дают прирост в конце своего хода:
// каждый «Табун» — коня, каждая «Берлога» — медведя, «Логово скорпионов» — скорпиона.
function animalIncomeSources(pi){
 const out={horses:0,bears:0,scorpions:0},z=zoneOf(pi);
 G.map.forEach(h=>{
  if(!z.has(K(h.q,h.r))||h.chip||h.lair)return;
  if(h.n==="Табун")out.horses++;
  else if(h.n==="Берлога")out.bears++;
  else if(h.n==="Логово скорпионов")out.scorpions++;
 });
 return out;
}
function gainAnimals(pi){
 const p=G.players[pi];if(!p)return[];
 const src=animalIncomeSources(pi),gained=[];
 Object.keys(ANIMAL_CAP).forEach(k=>{
  const room=ANIMAL_CAP[k]-animalCount(p,k),n=Math.min(room,src[k]||0);
  if(n>0){p[k]=animalCount(p,k)+n;gained.push([ANIMAL_RU[k],n]);}
  else p[k]=animalCount(p,k);
 });
 return gained;
}
function tradeSellAmount(kind){return Number(TRADESELL[kind])||0;}
function canTradeSell(p,kind){
 const qty=tradeSellAmount(kind);
 return !!(p&&qty&&(Number(p[kind])||0)>=qty&&(Number(p.gold)||0)<CAP);
}
function applyTradeSale(p,kind){
 const qty=tradeSellAmount(kind);if(!canTradeSell(p,kind))return false;
 p[kind]=clampRes((p[kind]||0)-qty);
 p.gold=clampRes((p.gold||0)+SELLPRICE);
 return true;
}
// Еда — запас: сколько будет на складе после прихода этого круга (для решений ИИ и подсветок).
function foodAvail(p){return (p.food||0)+(p.inFood||0);}
// долги и их последствия
function debtBuild(p){ // строительству мешает только долг по дереву или камню
 const owes=[];
 [["wood","дерево"],["stone","камень"]].forEach(([k,n])=>{
  if((Number(p&&p[k])||0)<0)owes.push(`${n} ${p[k]}`);
 });
 return owes.length?`долг по шкалам: ${owes.join(", ")}`:"";
}
function anyDebt(p){ // сохраняет общие ограничения долга для нестроительных действий
 const owes=[];
 [["food","еда"],["wood","дерево"],["stone","камень"],["steel","сталь"],["gold","золото"]].forEach(([k,n])=>{
  if((Number(p&&p[k])||0)<0)owes.push(`${n} ${p[k]}`);
 });
 return owes.length?`долг по шкалам: ${owes.join(", ")}`:"";
}
const BUILD_COSTS={
 post:{wood:1},camp:{wood:5},up2:{stone:5},up3:{wood:5,stone:5},
 // monument сохраняет цену основания для внешних справочников; следующие
 // строки экспортируют цены тела и купола отдельно.
 monument:{stone:5,wood:5,food:5},
 monument2:{stone:10,wood:10,food:10},
 monument3:{gold:5}
};
function buildReason(pi,k){
 const p=G.players[pi];
 if(!p)return "игрок не найден";
 const d=debtBuild(p);
 if(d)return `Строить нельзя: ${d}. Сначала погасите долг по дереву/камню.`;
 if(k==="post"&&postTokenUsed(pi)>=POSTSTOCK)
  return `Все ${POSTSTOCK} жетонов Поста уже используются: на поле или в Монументе.`;
 if(k==="monument"){
  const stage=monumentNextStage(pi),existing=monumentHex(pi);
  if(!stage)return existing?"Монумент уже завершён.":"Этот игрок уже основывал свой единственный Монумент за игру.";
  const stageData=MONUMENT_STAGES[stage];
  if(postTokensAvailable(pi)<(stageData.postTokens||1))return `Для этапа «${stageData.name}» нужен ещё один свободный жетон Поста.`;
  const cost=stageData.cost,labels={food:"еды",wood:"дерева",stone:"камня",steel:"стали",gold:"золота"};
  for(const [r,n] of Object.entries(cost))if((Number(p[r])||0)<n)
   return `Этап ${stage}/3 «${MONUMENT_STAGES[stage].name}»: недостаточно ${labels[r]} — нужно ${n}, в запасе ${p[r]||0}.`;
  return "";
 }
 if(k==="up2"&&settleCount(pi,1)<2)
  return "Для замка нужны минимум 2 своих деревни, включая улучшаемую.";
 if(k==="up3"&&settleCount(pi,2)<2)
  return "Для города нужны минимум 2 своих замка, включая улучшаемый.";
 const cost=BUILD_COSTS[k];
 if(!cost)return "неизвестная постройка";
 const labels={food:"еды",wood:"дерева",stone:"камня",steel:"стали",gold:"золота"};
 for(const [r,n] of Object.entries(cost))if((Number(p[r])||0)<n)
  return `Недостаточно ${labels[r]}: нужно ${n}, в запасе ${p[r]||0}. В долг строить нельзя.`;
 return "";
}
function debtWar(p){ // улучшению жителей и воинов мешает только долг по ЗОЛОТУ.
 // Долг по еде, дереву, камню или стали улучшения НЕ блокирует: отдельно
 // проверяется только конкретная цена самого улучшения.
 return p.gold<0?`долг по золоту (${p.gold})`:"";
}
// трата со склада (значения положительные = списать)
function spend(p,w,s,st,g){
 p.wood =clampRes((p.wood ||0)-w);
 p.stone=clampRes((p.stone||0)-s);
 p.steel=clampRes((p.steel||0)-st);
 p.gold =Math.max(-5,Math.min(CAP,(p.gold||0)-g));
 recalc(p.i);
}
// доход в конце хода игрока: поток прибавляется к складу
function collectIncome(pi){
 const p=G.players[pi];
 recalc(pi);
 const before={f:p.food,w:p.wood,s:p.stone,st:p.steel,g:p.gold};
 // долг медленно рассасывается сам: даже при нулевом потоке в круг возвращается 1
 const heal=(v,inc)=>v<0&&inc>=0?1:0;
 // Еда не «залечивается» сама: минус по еде надо выправлять действием, иначе голод.
 p.food =clampRes(p.food +p.inFood);
 p.wood =clampRes(p.wood +p.inWood +heal(p.wood,p.inWood));
 p.stone=clampRes(p.stone+p.inStone+heal(p.stone,p.inStone));
 p.steel=clampRes(p.steel+p.inSteel+heal(p.steel,p.inSteel));
 p.gold =Math.max(-5,Math.min(CAP,p.gold+p.inGold));
 const landmarkVP=landmarkTurnIncome(pi);
 if(landmarkVP)changeVP(pi,landmarkVP,"landmark_income");
 const animalGain=gainAnimals(pi);
 recalc(pi);
 const d=[];
 if(p.food-before.f)  d.push(`еда ${p.food-before.f>0?"+":""}${p.food-before.f}`);
 if(p.wood-before.w)  d.push(`дерево ${p.wood-before.w>0?"+":""}${p.wood-before.w}`);
 if(p.stone-before.s) d.push(`камень ${p.stone-before.s>0?"+":""}${p.stone-before.s}`);
 if(p.steel-before.st)d.push(`сталь ${p.steel-before.st>0?"+":""}${p.steel-before.st}`);
 if(p.gold-before.g)  d.push(`золото ${p.gold-before.g>0?"+":""}${p.gold-before.g}`);
 if(landmarkVP)d.push(`ПО +${landmarkVP} за ${landmarkVP===1?"первую расчищенную достопримечательность в своей зоне":"первые две расчищенные достопримечательности в своей зоне"}`);
 animalGain.forEach(([label,n])=>d.push(`${label} +${n}`));
 if(d.length)log(`${p.name} — приход: ${d.join(", ")}.`,isHuman(pi));
}

// ============ ГЕОМЕТРИЯ / ЗОНЫ =============
function settlementRadius(h){
 if(!h)return 0;
 if(h.camp!==undefined&&h.camp!==null)return 1;

function chainOf(pi,anchor){

  const controlledSettlement=isSettlement(h)&&settlementController(h)===pi;
  const mineToken=h.tok&&(h.tok.w?h.tok.o===pi:residentEffectOwner(h)===pi);
  const mineBuilding=h.bld&&h.bld.o===pi&&h.bld.k!=="city";

   nbk(h.q,h.r).forEach(([a,b])=>{if(hx(a,b))pass.add(K(a,b));});

function hexDist(q1,r1,q2,r2){

// сброд: Пионер; для армии теперь важен единственный лидер — Рыцарь или Князь
// рядовые: копейщик, лучник, мечник, бедуин; армию возглавляет Рыцарь или Князь
// офицеры: паладин, арбалетчик, воин скорпионов (создание — только при двух и более рядовых/Пионерах)
// полководцы: всадник, всадник на скорпионе, всадник на медведе — ОДИН на гарнизон города
// Класс фишки угрозы — по её слабой силе (как у воинов):
// 1 — сброд (0 ПО), 2–3 рядовой, 4 офицер, 5+ полководец.
function chipClass(s){return s<=1?"сброд":s<=3?"ряд":s===4?"офиц":"полк";}
function chipVP(s){const c=chipClass(s);return c==="сброд"?0:c==="офиц"?2:c==="полк"?3:1;}
function chipBattleStr(h){const c=h&&h.chip;if(!c)return 1;return c.s||1;}
// ПО за воина по классу: рядовой 1, офицер 2, полководец 3, орудие 1; сброд — 0; князь — вожак (4).
function warVP(name){
 if(name==="Пионер")return 0;   // сброд: за гибель и убийство 0 ПО
 if(name==="Князь")return 4;   // вожак
 if(name==="Рыцарь")return 2;   // офицерский класс
 const c=WCLASS[name];
 if(c==="оруд")return 1;       // справочная стоимость; в бою орудие не уничтожается и ПО за него не начисляются
 return c==="офиц"?2:c==="полк"?3:(c==="нет"||c==="сброд")?0:1;
}
// Класс воина: «полк»/«офиц»/«ряд»/«оруд» дают ПО за убийство/потерю по warVP.
// «сброд» — слабая сила 1: за гибель и за убийство очков нет (ред. 28).
// «нет» — без класса: при гибели ничего не происходит.
// Пионер относится к сброду: его потеря не меняет ПО, но он считается базовым
// воином при проверке соотношения классов.
const WCLASS={"Пионер":"сброд","Рыцарь":"лидер","Князь":"лидер","Лучник":"ряд","Копейщик":"ряд","Мечник":"ряд","Бедуин":"ряд",
 "Паладин":"офиц","Арбалетчик":"офиц","Воин скорпионов":"офиц","Капитан наёмников":"офиц",
 "Всадник":"полк","Всадник на скорпионе":"полк","Всадник на медведе":"полк",
 "Таран":"оруд","Баллиста":"оруд","Катапульта":"оруд"};
// гарнизон какого города держит этот гекс? есть ли там уже полководец?
function chainHasRider(pi,h){
 let out=false;
 const base=h&&h._hex?h._hex:h;
 controlledCityAnchors(pi).forEach(a=>{ if(out)return;
  const c=chainOf(pi,a);
  const has=c.some(x=>(x._hex||x)===base)||a===base;
  if(has&&c.some(x=>x.tok!==h.tok&&x.tok&&x.tok.w&&WCLASS[x.tok.t]==="полк"))out=true;
 });
 return out;
}

 "Лучник":["Арбалетчик","Копейщик"],

 "Бедуин":["Воин скорпионов"],
 "Паладин":["Всадник"],
 "Воин скорпионов":["Всадник на скорпионе"],
 "Всадник":["Всадник на медведе"]
};

// Базовые разовые цены. Особая цена Воина скорпионов (1/5 золота)
// рассчитывается функцией warUpgradeCost по состоянию карты.
const WAR_UPGRADE_COSTS={
 "Пионер":{
  "Копейщик":{wood:1},
  "Лучник":{wood:1},
  "Бедуин":{gold:2}
 },
 "Копейщик":{"Мечник":{steel:1}},
 "Лучник":{"Арбалетчик":{steel:1},"Копейщик":{wood:1}},
 "Мечник":{"Паладин":{steel:1}},
 "Бедуин":{"Воин скорпионов":{gold:5}},
 "Паладин":{"Всадник":{gold:1}},
 "Воин скорпионов":{"Всадник на скорпионе":{gold:1,steel:1}},
 "Всадник":{"Всадник на медведе":{gold:1}}
};

function upgradeBaseHex(slot){return slot&&slot._hex?slot._hex:slot;}
// Улучшение должно видеть не только одиночные и гарнизонные жетоны, но и
// конкретных воинов внутри армейской стопки. Общий hexWarSlots намеренно не
// расширяем: перемещение и ряд боевых выборов обрабатывают армии отдельно.
function upgradeWarSlots(h,pi){
 const out=hexWarSlots(h,pi);
 if(h&&h.army&&Number(h.army.o)===Number(pi)&&typeof armyBattleSlots==="function"){
  armyBattleSlots(h).forEach(slot=>{if(slot.tok&&Number(slot.tok.o)===Number(pi))out.push(slot);});
 }
 return out;
}
function armyUpgradeReason(slot,to){
 if(!slot||!slot._isArmySlot)return "";
 const army=slot._army,tok=slot.tok;
 if(!army||!tok||!Array.isArray(army.members)||!army.members.includes(tok))return "воин больше не состоит в армии";
 const next=army.members.map(wt=>wt===tok?{...wt,t:to}:wt);
 const why=typeof armyCompositionReason==="function"?armyCompositionReason(next):"";
 return why?`после улучшения состав армии станет неправильным: ${why}`:"";
}
function ownsClearedFeature(pi,name){
 for(const h of G.map.values()){
  if(h.n!==name||h.lair||h.chip)continue;
  const ownToken=(h.tok&&h.tok.o===pi)||(h.gar||[]).some(wt=>wt&&wt.o===pi);
  if(ownToken||zoneOf(pi).has(K(h.q,h.r))||(isSettlement(h)&&settlementController(h)===pi))return true;
 }
 return false;
}
function hasResidentOn(pi,name,re){
 for(const h of G.map.values()){
  if(h.n===name&&h.tok&&!h.tok.w&&h.tok.o===pi&&re.test(h.tok.t))return true;
 }
 return false;
}
function warUpgradeCost(from,to,pi){
 const base=((WAR_UPGRADE_COSTS[from]||{})[to])||{};
 const c={wood:base.wood||0,stone:base.stone||0,steel:base.steel||0,gold:base.gold||0};
 if(from==="Бедуин"&&to==="Воин скорпионов"&&ownsClearedFeature(pi,"Логово скорпионов"))c.gold=1;
 return c;
}
// Животное, расходуемое при создании конкретного всадника (один шаг цепочки).
const WARRIOR_ANIMAL_COST={"Всадник":{horses:1},"Всадник на скорпионе":{scorpions:1},"Всадник на медведе":{bears:1}};
function warriorAnimalText(a){
 const parts=[];
 if(a&&a.horses)parts.push(`${a.horses} коня`);
 if(a&&a.bears)parts.push(`${a.bears} медведя`);
 if(a&&a.scorpions)parts.push(`${a.scorpions} скорпиона`);
 return parts.join(" + ");
}
// Все воины, которых можно создать напрямую из жителя (по цепочкам от Пионера).
const CREATABLE_WARRIORS=["Пионер","Копейщик","Лучник","Мечник","Бедуин","Арбалетчик","Паладин","Воин скорпионов","Всадник","Всадник на скорпионе","Всадник на медведе"];
// Итоговая цена прямого создания: сумма цен всех шагов кратчайшей цепочки
// от Пионера до цели (без промежуточных жетонов на поле).
function directWarriorCost(to,pi){
 let best=null;
 const visit=(cur,path,cost,animals)=>{
  if(cur===to){
   const total=Object.values(cost).reduce((a,b)=>a+b,0)+Object.values(animals).reduce((a,b)=>a+b,0);
   if(!best||total<best.total)best={cost:{...cost},animals:{...animals},path:[...path],total};
   return;
  }
  if(path.length>6)return;
  (UPGPATH[cur]||[]).forEach(nxt=>{
   if(path.includes(nxt))return;
   const c=warUpgradeCost(cur,nxt,pi),nc={...cost},na={...animals};
   ["wood","stone","steel","gold"].forEach(k=>nc[k]=(nc[k]||0)+(c[k]||0));
   Object.entries(WARRIOR_ANIMAL_COST[nxt]||{}).forEach(([k,v])=>na[k]=(na[k]||0)+v);
   visit(nxt,[...path,nxt],nc,na);
  });
 };
 visit("Пионер",["Пионер"],{wood:0,stone:0,steel:0,gold:0},{});
 return best;
}
function directWarriorCostText(to,pi){
 const d=directWarriorCost(to,pi);if(!d)return "—";
 const parts=[];
 if(d.cost.wood)parts.push(`${d.cost.wood} дерева`);
 if(d.cost.stone)parts.push(`${d.cost.stone} камня`);
 if(d.cost.steel)parts.push(`${d.cost.steel} стали`);
 if(d.cost.gold)parts.push(`${d.cost.gold} золота`);
 const at=warriorAnimalText(d.animals);if(at)parts.push(at);
 return parts.length?parts.join(" + "):"бесплатно";
}
function warUpgradeCostText(from,to,pi){
 const c=warUpgradeCost(from,to,pi),parts=[];
 if(c.wood)parts.push(`${c.wood} дерева`);
 if(c.stone)parts.push(`${c.stone} камня`);
 if(c.steel)parts.push(`${c.steel} стали`);
 if(c.gold)parts.push(`${c.gold} золота`);
 return parts.length?parts.join(" + "):"бесплатно";
}

// Для офицера нужны два рядовых; Пионер как базовый воин тоже считается.
// Для полководца нужны два офицера. skip — улучшаемый жетон: после
// превращения он уже не относится к прежнему классу.
function countClass(pi,cls,skip){
 const skipTok=skip&&skip.tok;
 let n=0;
 const add=tok=>{
  if(!tok||tok===skipTok||tok.o!==pi||!tok.w)return;
  const c=WCLASS[tok.t];
  if(cls==="ряд"?(c==="ряд"||c==="сброд"):c===cls)n++;
 };
 G.map.forEach(h=>{add(h.tok);(h.gar||[]).forEach(add);(h.army&&h.army.members||[]).forEach(add);});
 return n;
}

function garrisonUpgradeDestinations(slot,to,pi){
 const base=upgradeBaseHex(slot);
 if(!slot||!slot.tok||!requiresGarrisonType(to))return [];
 return controlledCityAnchors(pi).filter(a=>{
  if(!isGarrisonPost(a)||garrisonController(a)!==pi)return false;
  // Если воин уже в этом гарнизоне, его собственное место остаётся доступным.
  if(slot._isGarSlot&&a===base)return true;
  return canStationIn(a,pi,to);
 });
}
function warriorMayStayAfterUpgrade(pi,slot,to){
 const h=upgradeBaseHex(slot);
 if(!h)return false;
 // Внутри армии жетон не покидает стопку автоматически. Улучшение допустимо
 // на месте, только если замена сохраняет правильный состав армии.
 if(slot&&slot._isArmySlot)return !armyUpgradeReason(slot,to);
 if(requiresGarrisonType(to))
  return !!(slot&&slot._isGarSlot&&isGarrisonPost(h)&&garrisonController(h)===pi);
 if(to==="Бедуин")return false; // отдельный Бедуин выбирает новый пустынный гекс
 if(to==="Воин скорпионов")return !slot._isGarSlot&&h.g==="desert"&&h.n!=="Пески";
 if(to==="Пионер")return true;
 return isRoamingWarriorType(to)&&!slot._isGarSlot;
}

// Свободные пустынные гексы своей зоны. Улучшаемый Пионер временно
// освобождает собственный гекс, поэтому при соблюдении правил может остаться там.
function bedouinDestinations(from,pi){
 pi=pi===undefined?(from&&from.tok?from.tok.o:ME()):pi;
 if(!from||!from.tok)return [];
 const tok=from.tok,base=upgradeBaseHex(from),canLift=base&&from===base&&base.tok===tok;
 if(canLift)base.tok=null;
 const out=validWarriorSlots(pi,"Бедуин").map(([q,r])=>hx(q,r)).filter(Boolean);
 if(canLift)base.tok=tok;
 return out;
}

function upgReason(slot,to,pi){
 pi=pi===undefined?ME():pi;
 const p=G.players[pi],tok=slot&&slot.tok;
 if(!p||!tok||tok.o!==pi||!tok.w)return "нужно выбрать своего воина";
 if(tok.def)return "автоматический защитник не улучшается";
 if(isSiege(tok.t))return "осадное орудие не улучшается";
 const from=tok.t,path=UPGPATH[from]||[];
 if(!path.includes(to))return "такой ветви улучшения нет";
 if(!WAR[to])return "неизвестный тип воина";
 const armyWhy=armyUpgradeReason(slot,to);if(armyWhy)return armyWhy;
 if(!stockOK(pi,to,from))return `все жетоны «${to}» (${stockMax(to)}) уже на поле`;
 const debt=debtWar(p);if(debt)return debt;
 const c=warUpgradeCost(from,to,pi);
 // Долг по ресурсу с нулевой ценой этого улучшения не блокирует его.
 if(c.wood>0&&(p.wood||0)<c.wood)return `нужно ${c.wood} дерева (есть ${p.wood||0})`;
 if(c.stone>0&&(p.stone||0)<c.stone)return `нужно ${c.stone} камня (есть ${p.stone||0})`;
 if(c.steel>0&&(p.steel||0)<c.steel)return `нужно ${c.steel} стали (есть ${p.steel||0})`;
 if(c.gold>0&&(p.gold||0)<c.gold)return `нужно ${c.gold} золота (есть ${p.gold||0})`;
 const tc=WCLASS[to],fc=WCLASS[from];
 if(tc==="офиц"&&fc!=="офиц"&&countClass(pi,"ряд",slot)<2)
  return "офицеру нужны ещё два рядовых воина или Пионера";
 if(tc==="полк"&&fc!=="полк"&&countClass(pi,"офиц",slot)<2)
  return "полководцу нужны ещё два офицера";
 if(to==="Бедуин"&&!warriorMayStayAfterUpgrade(pi,slot,to)&&!bedouinDestinations(slot,pi).length)
  return "нет свободного гекса пустыни в вашей зоне";
 if(requiresGarrisonType(to)&&!warriorMayStayAfterUpgrade(pi,slot,to)&&
    !garrisonUpgradeDestinations(slot,to,pi).length)
  return "нет свободного места в гарнизонах ваших поселений";
 if(to==="Всадник"&&(p.horses||0)<1)
  return "нужен 1 конь в запасе (Табун в своей зоне даёт прирост коней; ещё одного можно купить в торговле)";
 if(to==="Воин скорпионов"&&!warriorMayStayAfterUpgrade(pi,slot,to))
  return "воин скорпионов должен остаться в пустыне, но не на Песках";
 if(to==="Всадник на скорпионе"&&(p.scorpions||0)<1)
  return "нужен 1 скорпион в запасе (прирост даёт расчищенное Логово скорпионов в своей зоне)";
 if(to==="Всадник на медведе"&&(p.bears||0)<1)
  return "нужен 1 медведь в запасе (прирост даёт расчищенная Берлога в своей зоне)";
 if(!requiresGarrisonType(to)&&to!=="Бедуин"&&!warriorMayStayAfterUpgrade(pi,slot,to))
  return "после улучшения этот воин не может стоять на данном гексе";
 return "";
}

function warUpPay(pi,slot,to){
 const p=G.players[pi],from=slot.tok.t,c=warUpgradeCost(from,to,pi);
 p.wood=clampRes((p.wood||0)-c.wood);
 p.stone=clampRes((p.stone||0)-c.stone);
 p.steel=clampRes((p.steel||0)-c.steel);
 p.gold=Math.max(-5,Math.min(CAP,(p.gold||0)-c.gold));
 // Создание всадника расходует соответствующее животное из запаса.
 Object.entries(WARRIOR_ANIMAL_COST[to]||{}).forEach(([k,v])=>{p[k]=Math.max(0,(p[k]||0)-v);});
 return c;
}
function warUpgradeLog(from,to,c){
 const paid=[];
 if(c.wood)paid.push(`${c.wood} дерева`);
 if(c.stone)paid.push(`${c.stone} камня`);
 if(c.steel)paid.push(`${c.steel} стали`);
 if(c.gold)paid.push(`${c.gold} золота`);
 const at=warriorAnimalText(WARRIOR_ANIMAL_COST[to]);if(at)paid.push(at);
 return `<b>${from}</b> улучшен до <b>${to}</b>${paid.length?` (−${paid.join(", −")})`:""}.`;
}
function applyWarUpgrade(slot,to,pi){
 pi=pi===undefined?ME():pi;
 const why=upgReason(slot,to,pi);
 if(why)return why;
 if(requiresGarrisonType(to)&&!warriorMayStayAfterUpgrade(pi,slot,to))
  return "выберите гарнизон для нового воина";
 const from=slot.tok.t,c=warUpPay(pi,slot,to);
 slot.tok.t=to;
 log(warUpgradeLog(from,to,c),isHuman(pi));
 stat("warup");
 recalc(pi);
 return "";
}

function startUpg(){
 if(phaseLocked())return;
 const own=[];
 G.map.forEach(h=>{
  if(upgradeWarSlots(h,ME()).some(slot=>slot.tok&&!slot.tok.def&&(UPGPATH[slot.tok.t]||[]).length))own.push([h.q,h.r]);
 });
 highlight=own;G.sel={type:"upg"};
 hint(own.length?"Выберите воина для улучшения.":"Нет воинов с доступной ветвью улучшения.");
 ui();
}
function selectUpgHex(h){
 if(!h)return;
 const slots=upgradeWarSlots(h,ME()).filter(slot=>slot.tok&&!slot.tok.def&&(UPGPATH[slot.tok.t]||[]).length);
 if(!slots.length){hint("На этом гексе нет воина, которого можно улучшить.");ui();return;}
 if(slots.length===1){showWarUpgradeMenu(slots[0]);return;}
 G._pickSlots=slots;
 openPick("Какого воина улучшить?",slots.map((slot,i)=>
  `<div class="opt"><button onclick="closePick();showWarUpgradeMenu(G._pickSlots[${i}])">${slot.tok.t}</button>`+
  `<span style="color:#93856f">сила ${WAR[slot.tok.t].s}/${WAR[slot.tok.t].S}</span></div>`
 ).join(""),"cancelWarUpg()");
}
function showWarUpgradeMenu(slot){
 if(!slot||!slot.tok)return;
 G.upgSlot=slot;
 const from=slot.tok.t;
 const btns=(UPGPATH[from]||[]).map(to=>{
  const why=upgReason(slot,to,ME()),W=WAR[to];
  return `<div class="opt"><button ${why?"disabled":""} ${why?"":`onclick="pickWarUpgrade('${to}')"`}>${to}</button>`+
   `<span style="color:#93856f">${warUpgradeCostText(from,to,ME())} · сила ${W.s}/${W.S}</span>`+

 }).join("");
 openPick(`Кого сделать из «${from}»?`,btns,"cancelWarUpg()");

}
function pickWarUpgrade(to){
 closePick();
 const slot=G.upgSlot;
 if(!slot||!slot.tok){hint("Выбранный воин больше недоступен.");cancelWarUpg();return;}
 const why=upgReason(slot,to,ME());
 if(why){hint(`Нельзя: ${why}.`);ui();return;}
 if(to==="Бедуин"&&!warriorMayStayAfterUpgrade(ME(),slot,to)){
  const spots=bedouinDestinations(slot,ME());
  highlight=spots.map(h=>[h.q,h.r]);
  G.sel={type:"bedouin",from:K(upgradeBaseHex(slot).q,upgradeBaseHex(slot).r),fromSlot:slot};
  hint("Куда поставить Бедуина? Выберите свободный гекс пустыни в своей зоне.");ui();return;
 }
 if(requiresGarrisonType(to)&&!warriorMayStayAfterUpgrade(ME(),slot,to)){
  const spots=garrisonUpgradeDestinations(slot,to,ME());
  highlight=spots.map(h=>[h.q,h.r]);
  G.sel={type:"upggarrison",from:K(upgradeBaseHex(slot).q,upgradeBaseHex(slot).r),fromSlot:slot,to};
  hint(`В какой свободный гарнизон перевести нового воина <b>${to}</b>? Оплата произойдёт после выбора.`);ui();return;
 }
 const err=applyWarUpgrade(slot,to,ME());
 G.upgSlot=null;G.sel=null;highlight=[];
 hint(err?`Нельзя: ${err}.`:`Воин улучшен до <b>${to}</b>.`);ui();
}
function placeGarrisonUpgrade(from,to,targetType){
 const pi=ME();
 if(!from||!from.tok||!to||!targetType){
  hint("Исходный воин или гарнизон больше недоступен.");ui();return;
 }
 const allowed=garrisonUpgradeDestinations(from,targetType,pi);
 if(!allowed.some(h=>h===to)){
  hint("Выберите свободный гарнизон своего поселения.");ui();return;
 }
 const why=upgReason(from,targetType,pi);
 if(why){hint(`Нельзя: ${why}.`);ui();return;}
 const was=from.tok.t,c=warUpPay(pi,from,targetType),wt={...from.tok,t:targetType};
 from.tok=null;
 if(!placeWarriorOnHex(to,wt)){
  from.tok={...wt,t:was};
  // Защитная компенсация на случай, если состояние изменилось между выбором и кликом.
  const p=G.players[pi];p.wood+=c.wood;p.stone+=c.stone;p.steel+=c.steel;p.gold+=c.gold;
  hint("Гарнизон успел заполниться; улучшение отменено.");ui();return;
 }
 log(warUpgradeLog(was,targetType,c).replace(/\.$/,` и переведён в гарнизон «${to.n}».`),1);
 stat("warup");
 G.sel=null;G.upgSlot=null;highlight=[];recalc(pi);
 hint(`<b>${targetType}</b> занял гарнизон «${to.n}».`);ui();
}

function placeBedouin(from,to){
 const pi=ME();
 if(!from||!from.tok||!to||!bedouinDestinations(from,pi).some(h=>h===to)){
  hint("Бедуина можно поставить только на свободный гекс пустыни в своей зоне.");ui();return;
 }
 const why=upgReason(from,"Бедуин",pi);
 if(why){hint(`Бедуин недоступен: ${why}.`);ui();return;}
 const was=from.tok.t,c=warUpPay(pi,from,"Бедуин"),wt={...from.tok,t:"Бедуин"};
 from.tok=null;to.tok=wt;
 log(warUpgradeLog(was,"Бедуин",c),1);stat("warup");
 G.sel=null;G.upgSlot=null;highlight=[];recalc(pi);hint("Бедуин занял пустынный гекс.");ui();
}
function cancelWarUpg(){
 G.sel=null;G.upgSlot=null;G._pickSlots=null;highlight=[];

}

// ============ ЛОГОВА =============
const WETN=h=>h.n==="Вода"; // вода в любом виде
function lairType(n){
 // ни одна угроза не расползается в горы
 const NOMOUNT=h=>h.g!=="mount";
 if(n==="Лагерь разбойников")
  return{bag:"black",terr:h=>NOMOUNT(h)&&!WETN(h)&&h.g!=="water",face:true};
 if(n==="Крабы")
  return{bag:"crab",terr:h=>h.g==="water"||h.g==="field"||h.g==="forest",face:true}
 // Пещера удалена из колоды; достопримечательность «Рубиновая пещера» охраняется Паучихой через LANDMARKS
 if(n==="Логово скорпионов")
  // скорпионы — отдельная армия; не селятся на гексах с животными
  return{bag:"scorpion",terr:h=>NOMOUNT(h)&&!WETN(h)&&!BEASTHEX.includes(h.n)&&
           (h.g==="desert"||h.g==="field"),face:true}
 return{bag:"green",terr:h=>NOMOUNT(h)&&!WETN(h)&&(h.g==="field"||h.n==="Лес"),face:true,
        filter:c=>c.n==="Волк"||c.n==="Вороны"||c.n==="Медведь"};
}
// Где фишке логова встать нельзя (ред. 28): горы — никому, вода — всем, кроме крабов.
// Крабы — логово биомы «вода», им море родное; остальные угрозы на воду не выходят.
function lairChipOk(lairName,h){
 if(!h)return false;
 if(isLandmark(h.n))return false;        // достопримечательность — только для её стража
 if(h.g==="mount")return false;
 if(h.g==="water")return lairName==="Крабы";
 return true;
}
function chipBagArray(bag){
 return bag==="black"?G.black:bag==="scorpion"?G.scorp:bag==="crab"?G.crab:G.green;
}
function drawChip(bag,filter){
 const src=chipBagArray(bag);
 if(!src||!src.length)return null;
 // лидеры в свиту никогда не попадают: их ставит только seatBoss
 const ok=c=>!isBossChip(c.n)&&(!filter||filter(c));
 const back=[];let got=null;
 while(src.length){const c=src.pop();if(ok(c)){got=c;break;}back.push(c);}
 src.push(...shuffle(back));
 return got;
}
// Вернуть именно физическую фишку в её мешок. Служебные признаки поля,
// события и гарнизона не переносятся на следующую выкладку.
function returnThreatChip(chip,fallbackBag="black"){
 if(!chip)return false;
 const bag=chip.bag||fallbackBag,src=chipBagArray(bag);if(!Array.isArray(src))return false;
 const clean={n:chip.n,s:Number(chip.s)||0};

// Новое поселение сразу открывает все недостающие гексы вокруг себя (ред. 29):
// тянем из основной колоды, пока по правилам стыковки не заполнится всё кольцо.
// Это автоматическая достройка, а не фаза разведки: неподходящие гексы остаются
// в основной колоде. Логова в этом случае на поле не ложатся — уходят под низ.
function surroundBuild(pi,h,what){
 if(!h)return 0;
 if(!G.deck.length&&typeof recycleTerrainDiscard==="function")recycleTerrainDiscard();
 let laid=0,lairs=0,events=0,failed=0;
 nbk(h.q,h.r).forEach(([q,r])=>{
  if(hx(q,r))return;                        // гекс уже на карте
  if(!G.deck.length&&typeof recycleTerrainDiscard==="function")recycleTerrainDiscard();
  let fitted=null,tries=0;
  const seen=G.deck.length;
  while(tries<seen*2&&G.deck.length){       // тянем сверху; не подошёл — под низ колоды
   const c=G.deck.pop(); tries++;
   // Красные события разрешаются только в фазе разведки: автоматическая
   // достройка поселения всегда откладывает их под низ основной колоды.
   if(isRedTerrainEvent(c)){G.deck.unshift(c);events++;continue;}
   if(isLair(c.n)){G.deck.unshift(c);lairs++;continue;}   // логово — под низ, на поле не кладём
   if(biomeFits(c,q,r)){fitted=c;break;}
   G.deck.unshift(c);
  }
  if(!fitted){failed++;return;}
  G.map.set(K(q,r),{q,r,...fitted});laid++;
  const nh=hx(q,r);
  if(fitted.n==="Вода")seedCrab(nh,pi);
  else if(isLandmark(fitted.n))seedGuard(nh,pi);
  else seedThreat(nh,pi);
 });
  log(`${what} осваивает округу: открыто гексов — <b>${laid}</b>`+
     (lairs?`, логов отложено под низ колоды — ${lairs}`:``)+
     (events?`, красных событий сохранено для разведки — ${events}`:``)+
     (failed?`, не состыковалось — ${failed}`:``)+`.`,isHuman(pi));

}
// Логово при открытии окружается случайными гексами из основной колоды. Это
// автоматическое расширение, а не фаза разведки, поэтому неподошедшие остаются
// в основной колоде и уходят под низ. Затем на КАЖДЫЙ соседний гекс встаёт фишка воина
// из мешка этого логова (лагерь разбойников — чёрный, крабы — крабовый,
// скорпионы — скорпионий, берлога — зелёный: только волки и медведи).
function expandLair(h){
 if(!h||!h.lair)return;
 if(!G.deck.length&&typeof recycleTerrainDiscard==="function")recycleTerrainDiscard();

 let laid=0,events=0;
 nbk(h.q,h.r).forEach(([q,r])=>{
  if(hx(q,r))return;                       // клетка уже на карте — не трогаем
  if(!G.deck.length&&typeof recycleTerrainDiscard==="function")recycleTerrainDiscard();
  let fitted=null, tries=0,seen=G.deck.length;
  while(tries<seen&&G.deck.length){        // тянем сверху; не подошёл — под низ колоды
   const c=G.deck.pop(); tries++;
   // У автоматического расширения нет открывшего Пионера, поэтому красное
   // событие остаётся в колоде до обычной разведки.
   if(isRedTerrainEvent(c)){G.deck.unshift(c);events++;continue;}
   if(biomeFits(c,q,r)){fitted=c;break;}
   G.deck.unshift(c);
  }
  if(fitted){G.map.set(K(q,r),{q,r,...fitted});laid++;}
 });

// Начало нового круга (перед ходом первого игрока): на ВСЕ свободные гексы-
// источники угроз вне зон всех игроков снова ставится фишка соответствующей
// угрозы — звери и Бурелом из зелёного мешка, Шахта и Золотая жила из чёрного,
// Вода получает краба/рака. Гекс с жителем, воином, армией, постройкой или уже

function respawnThreats(){

 for(let i=1;i<=G.N;i++){if(G.out[i])continue;zoneOf(i).forEach(k=>zkeys.add(k));}
 G.map.forEach(h=>{
  if(h.chip||h.tok||h.army||h.bld||h.camp||h.post||h.lair)return;          // гекс занят — ставить некуда
  if(zkeys.has(K(h.q,h.r)))return;                         // в зоне игрока угроза не возрождается
  if(h.n==="Вода"){
   if(seedCrab(h,G.cur))return;

  if(bag){
   const c=drawChip(bag);
   if(c){h.chip={...c,face:true,bag};
    log(`«${h.n}» снова под охраной: ${c.n}.`,isHuman(G.cur));}
  }
 });

 // восстанавливаются только внутри гекса логова, во внутреннем гарнизоне вместимостью 6.
 G.lairs.forEach(l=>{
  const lh=hx(l.q,l.r); if(!lh||!lh.lair)return;           // зачищенное логово не восстанавливается
  ensureLairGarrison(l);

 });
}

// Mobile shortcut: collapse the other action groups, open the requested one and
// scroll it inside the turn pane rather than the body (the body is locked for the map).
function jumpAction(id){
 const pane=document.getElementById("t1"),target=document.getElementById(id);
 if(!pane||!target)return false;
 document.querySelectorAll("#acts details.actiongrp").forEach(d=>{d.open=d===target;});
 target.open=true;
 const move=()=>{
  const pr=pane.getBoundingClientRect(),tr=target.getBoundingClientRect();
  const top=Math.max(0,pane.scrollTop+tr.top-pr.top-8);
  if(typeof pane.scrollTo==="function")pane.scrollTo({top,behavior:"smooth"});
  else pane.scrollTop=top;
 };
 if(typeof requestAnimationFrame==="function")requestAnimationFrame(move);else move();
 return true;
}

// ============ ХОД ИГРОКА =============
// Отдельный полевой Пионер один раз за свой ход проходит по связному маршруту
// до пяти соседних гексов. Гарнизонный Пионер сначала бесплатно выходит на
// свободный гекс у зоны своего поселения и сохраняет этот полный маршрут.
// Пионер внутри армии использует марш армии.
const PIONEER_SPEED=5;
// Право базового драфта дают только деревня, замок и город. Пост остаётся
// поселением для зоны, гарнизона и развития, но никогда не увеличивает драфт.
function draftSettlementCount(pi){return cityAnchors(pi).filter(h=>!h.post).length;}
function draftRights(pi){return draftSettlementCount(pi)+recruiterCount(pi);}
function terrainPhaseDone(){return !(G.pending&&G.pending.length)&&!G.oldMapChoice&&!G.cartographersCorrection&&!G.invasionChoice&&
 !G.newHorizonsChoice&&!G.secondChanceChoice&&!G.deathChoice&&!G.prestigeChoice&&!G.battle;}
function draftPhaseDone(){return terrainPhaseDone()&&!(G.draft&&G.draft.length);}
// Кнопка завершения хода зависит только от обязательной разведки. Драфт можно
// пропустить этой же кнопкой; дополнительные действия по-прежнему требуют
// отдельного завершения драфта.
function humanTurnEndReady(){
 return typeof G!=="undefined"&&G&&!G.over&&!G.startFill&&isHuman(G.cur)&&terrainPhaseDone();
}
function tradeActionsUsed(){return Number(G.acts&&G.acts.trade)||0;}
function tradeActionsLeft(pi){return Math.max(0,tradeRights(pi)-tradeActionsUsed());}
function useTradeAction(kind){
 if(tradeActionsLeft(ME())<=0)return false;
 G.acts.trade=tradeActionsUsed()+1;
 G.acts.lastTrade=kind||"trade";
 return true;
}
const SPECIAL_RU={steal:"воровство",kill:"покушение Ассасина",merc:"наём наёмника",exile:"изгнание"};
function specialActionUsed(){return G.acts&&G.acts.special||"";}
function useSpecialAction(kind){
 if(specialActionUsed())return false;
 G.acts.special=kind;return true;
}
function specialActionLabel(){const k=specialActionUsed();return k?(SPECIAL_RU[k]||k):"";}
// В партии есть ровно две логические стопки: основная колода и единый сброс.
// В сброс уходят все не выставленные в фазе разведки гексы, отработавшие
// красные гексы и гексы, снятые корректировкой карты. Под низ основной колоды
// такие гексы не возвращаются. Когда основная колода пуста, весь сброс
// перемешивается и становится новой основной колодой.
function ensureTerrainDiscard(){if(!Array.isArray(G.terrainDiscard))G.terrainDiscard=[];return G.terrainDiscard;}
function terrainCardFromHex(h){
 const card={g:h.g,n:h.n};
 if(isOldMap(h))card.oldMapChoices=oldMapCandidateCount(h);
 return card;
}
function discardTerrainCards(cards){
 const list=(Array.isArray(cards)?cards:[cards]).filter(Boolean).map(terrainCardFromHex);
 if(list.length)ensureTerrainDiscard().push(...list);
 return list.length;
}
function discardExplorationTerrain(pi,c,why){
 if(!c)return false;
 discardTerrainCards(c);scoutVP(pi,c,false,why||"nofit");return true;
}
function recycleTerrainDiscard(){
 const discard=ensureTerrainDiscard();
 if((G.deck||[]).length||!discard.length)return false;
 G.deck=shuffle(discard.splice(0));
 G.terrainRecycle=(Number(G.terrainRecycle)||0)+1;G.deckNoted=false;
 log(`<b>Колода сброса перемешана:</b> она стала основной колодой из ${G.deck.length} гекс(ов), цикл ${G.terrainRecycle}.`,1);
 return true;
}
function drawTerrainCards(n){
 recycleTerrainDiscard();
 for(let i=0;i<n;i++){
  if(!G.deck.length&&!recycleTerrainDiscard())break;
  G.pending.push(G.deck.pop());
 }
 if(!G.deck.length&&!ensureTerrainDiscard().length&&!G.pending.length&&!G.deckNoted){
  G.deckNoted=true;log("Основная колода и колода сброса исчерпаны — разведки пока нет, но партия продолжается.",1);
 }
}
// Все пустые клетки, соседние хотя бы одному уже открытому гексу. В отличие от
// обычной разведки, «Старая карта» не привязана к конкретному Пионеру.
function globalTerrainFrontier(){
 const seen=new Set(),out=[];
 G.map.forEach(h=>nbk(h.q,h.r).forEach(([q,r])=>{
  const k=K(q,r);if(hx(q,r)||seen.has(k))return;seen.add(k);out.push([q,r]);
 }));
 return out;
}
function oldMapLegalSlots(card){
 if(!card||isRedTerrainEvent(card))return [];
 return globalTerrainFrontier().filter(([q,r])=>biomeFits(card,q,r));
}
// Красные гексы, попавшие в добор, не срабатывают. Они временно откладываются,
// чтобы после превращения сброса в новую основную колоду их нельзя было тянуть
// по кругу бесконечно в рамках той же «Старой карты».
function drawOldMapCandidates(limit=3){
 const cards=[],red=[];let recycled=false,guard=0;
 limit=Math.max(0,Number(limit)||0);
 while(cards.length<limit&&guard++<10000){
  if(!G.deck.length){
   if(recycled||!recycleTerrainDiscard())break;
   recycled=true;
  }
  if(!G.deck.length)break;
  const card=G.deck.pop();
  if(isRedTerrainEvent(card)){red.push(card);continue;}
  cards.push(card);
 }
 if(red.length){discardTerrainCards(red);for(let i=0;i<red.length;i++)stat("oldMapRedSkipped");}

function explorationSources(pi,h){

   const n=armyPioneerCount(near.army,pi);if(n)out.push({kind:"army",h:near,army:near.army,pioneers:n});
  }
  if(near.tok&&near.tok.w&&near.tok.t==="Пионер"&&Number(near.tok.o)===Number(pi))out.push({kind:"pioneer",h:near,slot:near,pioneers:1});

function pioneerMoveFinished(wt){return !!(wt&&(Number(wt.pioneerMoved)>0||wt.pioneerAttacked));}
function markArmyPioneersMoved(army){
 (army&&army.members||[]).forEach(wt=>{if(wt&&wt.t==="Пионер")wt.pioneerMoved=Math.max(1,Number(wt.pioneerMoved)||0);});
}
// Полевой Пионер проходит один связный маршрут. Пионер из внутреннего гарнизона
// бесплатно выходит на любой свободный допустимый гекс, соседний хотя бы одному
// гексу зоны именно исходного поселения, и после выхода сохраняет полный маршрут.
// Чужая зона, угроза, логово, любая армия и занятый гекс недоступны.
function pioneerMoveReach(slot,pi,maxSteps=PIONEER_SPEED){
 if(!slot||!slot.tok||slot.tok.t!=="Пионер"||pioneerMoveFinished(slot.tok))return [];
 const start=slot._hex||slot,fz=foeZones(pi);
 if(slot._isGarSlot){
  return settlementDeploymentHexes(start).filter(h=>
   scoutLandingOK(h)&&!h.army&&!fz.has(K(h.q,h.r))
  ).map(h=>({h,d:0,path:[h],deployment:true}));
 }
 const seen=new Map([[K(start.q,start.r),0]]),queue=[{h:start,d:0,path:[]}],out=[];
 while(queue.length){
  const cur=queue.shift();
  if(cur.d>=maxSteps)continue;
  nb(cur.h.q,cur.h.r).forEach(n=>{
   const k=K(n.q,n.r),d=cur.d+1;if(seen.has(k)&&seen.get(k)<=d)return;
   if(fz.has(k))return;
   const garOK=isGarrisonPost(n)&&garrisonController(n)===pi&&canStationIn(n,pi,"Пионер");
   const fieldOK=scoutLandingOK(n)&&!n.army;
   if(!garOK&&!fieldOK)return;
   seen.set(k,d);
   const step={h:n,d,path:cur.path.concat(n)};out.push(step);
   if(fieldOK)queue.push(step);
  });
 }
 return out;
}
function pioneerMoveInfo(slot,pi,to){return pioneerMoveReach(slot,pi).find(x=>x.h===to)||null;}
function movePioneerTo(slot,to,pi,quiet){
 const info=pioneerMoveInfo(slot,pi,to);if(!info||!slot.tok)return false;
 const from=slot._hex||slot,wt=slot.tok;slot.tok=null;
 wt.pioneerMoved=info.d;
 if(isGarrisonPost(to)){
  if(!placeWarriorOnHex(to,wt)){
   wt.pioneerMoved=0;
   if(slot._isGarSlot)garList(from).push(wt);else from.tok=wt;
   return false;
  }
 }else to.tok=wt;
 if(!quiet)log(info.deployment
  ?`<b>Пионер бесплатно вышел из гарнизона</b> на свободный гекс у зоны исходного поселения — «${to.n}». Полный маршрут до ${PIONEER_SPEED} гексов сохранён.`
  :`<b>Пионер прошёл ${info.d} из ${PIONEER_SPEED} гексов</b> по связному маршруту и остановился на «${to.n}».`,isHuman(pi));
 stat("pioneerMove");recalc(pi);return true;
}
function warriorMoveDestinations(slot,pi){
 if(!slot||!slot.tok)return [];
 const base=slot._hex||slot,type=slot.tok.t;
 if(type==="Пионер")return pioneerMoveReach(slot,pi).map(x=>x.h);
 // Орудие не перемещается само. Его забирают при формировании/пополнении
 // правильной армии, после чего оно движется только вместе с этой армией.
 if(isSiege(type))return [];
 const out=validWarriorSlots(pi,type).map(([q,r])=>hx(q,r)).filter(Boolean);
 // Для внешней фишки на гексе поселения вход во внутренний гарнизон считается
 // перемещением; уже занятый внутренний слот не предлагает холостой ход.
 return out.filter(h=>h!==base||(!slot._isGarSlot&&isGarrisonPost(h)));
}

function buildMonumentStage(pi,h){
 const p=G.players&&G.players[pi],stage=monumentNextStage(pi),data=monumentStageData(stage);
 if(!p||!h||!stage||!data||(G.acts&&G.acts.build)||buildReason(pi,"monument"))return null;
 const legal=validBuildSlots(pi,"monument").some(([q,r])=>q===h.q&&r===h.r);
 if(!legal)return null;
 // Каждый этап связывает один дополнительный жетон Поста; сам факт хранится
 // номером этапа и учитывается postTokenUsed().
 for(const [r,n] of Object.entries(data.cost)){
  if(r==="gold")p.gold=Math.max(-5,Math.min(CAP,(p.gold||0)-n));
  else p[r]=clampRes((p[r]||0)-n);
 }
 if(stage===1){
  const founder=h.tok;
  h.tok=null;h.bld={k:"monument",o:pi,stage:1};
  if(founder)placeWarriorOnHex(h,founder);
  p.monumentBuilt=true;
 }else{
  h.bld.stage=stage;
  // Автоматического защитника Монумент не получает.
 }
 p.monument={q:h.q,r:h.r,stage,done:stage===MONUMENT_MAX_STAGE};
 if(G.acts)G.acts.build=1;
 stat(`monumentStage${stage}`);if(stage===MONUMENT_MAX_STAGE)stat("monument");
 recalc(pi);
 return {stage,data,h};
}

 // Дерево и камень для стройки должны быть в запасе; долги по другим шкалам ей не мешают.

 spend(p,w,s,0,0);
 return true;
}

function aiMasterValue(pi,n,src,destHex){
 const cnt=f=>{let k=0;G.map.forEach(h=>{if(h.tok&&residentEffectOwner(h)===pi&&f(h))k++;});return k;};
 if(n==="Вербовщик")return G.round<=10?14:G.round<=16?9:4;
 if(n==="Лесозаготовщик")return 4*(cnt(h=>!h.tok.w&&/^Лесоруб★?$/.test(h.tok.t)&&residentAnchorFor(pi,h.q,h.r))-(/^Лесоруб/.test(src)?1:0));
 if(n==="Геолог")return 4*(cnt(h=>!h.tok.w&&/^Шахтёр★?$/.test(h.tok.t)&&residentAnchorFor(pi,h.q,h.r))-(/^Шахтёр/.test(src)?1:0));
 if(n==="Повар"){
  const a=destHex?residentAnchorFor(pi,destHex.q,destHex.r):null;
  if(!a)return 0;
  const ak=K(a.q,a.r);
  let total=0;
  G.map.forEach(h=>{
   if(!(h.tok&&residentEffectOwner(h)===pi&&!h.tok.w))return;
   if(h.tok.t==="Повар")return;
   const a2=residentAnchorFor(pi,h.q,h.r);
   if(!a2||K(a2.q,a2.r)!==ak)return;
   const R=RES[h.tok.t];if(!R)return;
   let fd=(R.d&&R.d.food)||0;
   if(R.alt&&R.alt[h.n]!==undefined)fd=R.alt[h.n];
   if(fd>0)total++;
  });
  return 4*total;
 }
 const ws=Object.keys(SMITH).filter(w=>SMITH[w]===n);
 if(ws.length){
  let k=0;
  G.map.forEach(h=>{
   if(h.tok&&h.tok.o===pi&&h.tok.w&&ws.includes(h.tok.t))k++;
   (h.gar||[]).forEach(wt=>{if(wt&&wt.o===pi&&wt.w&&ws.includes(wt.t))k++;});
  });

 }

}

// Прокси одного жетона внутри стопки армии. Боевая система умеет снимать и

function armySlot(h,wt,army){

  q:h.q,r:h.r,n:h.n,g:h.g,
  _isArmySlot:true,_hex:h,_army:army,_wt:wt,
  get tok(){return army&&Array.isArray(army.members)&&army.members.includes(wt)?wt:null;},
  set tok(v){
   if(!army)return;
   if(!Array.isArray(army.members))army.members=[];
   const idx=army.members.indexOf(wt);
   if(v===null){if(idx>=0)army.members.splice(idx,1);return;}
   if(v&&typeof v==="object"){

function armyFormationPool(pi,anchor){
 const out=[],seen=new Set();
 // Обычные бойцы берутся из зоны/гарнизона. Трофейные орудия дополнительно
 // берутся из безразмерного резерва именно этого гарнизона: сами они гарнизон
 // не защищают и места в нём не занимают.
 const slots=zoneGarrison(pi,anchor).concat(
  siegeReserveList(anchor).map(wt=>siegeReserveSlot(anchor,wt)),
  ((G.players[pi]&&G.players[pi].siegeTrophies)||[]).map(wt=>({
   q:anchor.q,r:anchor.r,n:anchor.n,g:anchor.g,_isSiegeFallback:true,_hex:anchor,_wt:wt,
   get tok(){return (G.players[pi].siegeTrophies||[]).includes(wt)?wt:null;},
   set tok(v){const arr=G.players[pi].siegeTrophies||[],i=arr.indexOf(wt);if(v===null&&i>=0)arr.splice(i,1);}
  }))
 );
 slots.forEach(slot=>{
  const wt=slot&&slot.tok;
  if(!wt||!wt.w||(wt.def&&!isLeaderToken(wt))||wt.revolt||Number(wt.o)!==Number(pi)||armyRole(wt.t)==="none"||seen.has(wt))return;
  seen.add(wt);out.push(slot);
 });
 return out;
}
function armyCanChooseValid(slots){
 let leaders=0,warriors=0;
 (slots||[]).forEach(s=>{const r=s&&s.tok?armyRole(s.tok.t):"none";if(r==="leader")leaders++;if(r==="warrior")warriors++;});

}
function armyTerrainReason(h){

 if(h.g==="desert"&&!nb(h.q,h.r).some(n=>n.g==="water"))return "пустыня доступна армии только рядом с водой";

}

function armyFormationTileOpen(h){

}
function armyMoveTileOpen(h){return !!(h&&!isWorldEdge(h)&&!h.army&&!h.tok&&!h.chip&&!h.lair&&!h.bld&&!h.camp&&!h.post);}
function armyWaterEntryCost(from,to,count){

}
function armyFormationHexes(anchor,pi,count){
 const p=G.players[pi],out=[];
 // Армия выходит именно из выбранного гарнизона, но стартовый гекс можно
 // выбрать у любой грани всей зоны этого поселения, а не только рядом с якорем.
 settlementDeploymentHexes(anchor).forEach(h=>{
  if(!armyFormationTileOpen(h)||armyForeignZone(pi,h)||armyTerrainReason(h))return;
  const cost=h.g==="water"?Math.max(0,Number(count)||0)*ARMY_WATER_WOOD_PER_WARRIOR:0;

}
function armyFormationOptions(pi){

function armyAutoDraft(slots){
 const indexed=slots.map((slot,i)=>({slot,i,wt:slot.tok})).filter(x=>x.wt);
 const leaders=indexed.filter(x=>armyRole(x.wt.t)==="leader").sort((a,b)=>(WAR[b.wt.t].S-WAR[a.wt.t].S));
 const reg=indexed.filter(x=>armyRole(x.wt.t)==="warrior").sort((a,b)=>{
  const ap=a.wt.t==="Пионер"?-4:0,bp=b.wt.t==="Пионер"?-4:0;
  return (WAR[b.wt.t].S+bp)-(WAR[a.wt.t].S+ap);
 });
 const picks=[];
 if(leaders[0])picks.push(leaders[0].i);
 reg.slice(0,2).forEach(x=>picks.push(x.i));
 // Орудия не занимают квоту рядовых. По умолчанию берём все доступные,
 // включая трофеи из резерва; человек при желании снимет отметку вручную.
 indexed.filter(x=>armyRole(x.wt.t)==="support").forEach(x=>picks.push(x.i));

}

function armyMoveReason(entry,to){

 const from=entry.h,a=entry.army,pi=a.o;
 if(a.attacked)return "после нападения армия не движется";
